# SPDX-License-Identifier: GPL-3.0-only
# The static web site on GitHub Pages: the web installer and the web editor, made by web/make_site.py (no server).
# The installer offers the published releases, each with its published flavours (firmware/r/<tag>/, downloaded from the
# releases here: a page cannot fetch a release file itself, GitHub sends it with no CORS header), and this commit's
# development build of each flavour in web/flavours.json (firmware/optimist-<version>-<id>.fwsc), all fetched by a
# relative URL and checked against the SHA-256 written into the page. The latest release's simulators are built from its
# tag's own source (firmware/r/<tag>/*.wasm), and site.json names it ("latest": tag, commit): the builder and the
# Simulator tab start from that release, main stays a choice. A release published redeploys the site. The
# toolchain is downloaded on the runner as build.yml does. The editor needs no firmware. Details: docs/WEB.md.
#
# Needs Pages enabled with the source "GitHub Actions" (Settings > Pages); on a private repository that needs a
# plan that allows Pages for private repositories. The github-pages environment deploys from main only (its
# protection rule, 2026-10-18): the site is built on main alone, and a published release asks for a run on main
# (workflow_dispatch) instead of deploying from its tag, which the rule refuses.
# Pages serves the site under /<repository>/ : every URL in the site is relative, so that works.
name: pages

on:
  push:
    branches: [main]
  release:
    types: [published]                     # (its packages join the installer's list: a run on main, job redeploy)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: A run on main (the environment deploys from main only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  site:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Cache the toolchain and the SDK files
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.jieli
            sdk
          key: jieli-${{ hashFiles('tools/toolchain.py') }}
      - name: Setup (toolchain, SDK files, Python packages)
        run: python tools/optimist.py setup --yes --no-emu
      - name: Package the profile of each flavour in web/flavours.json
        run: |
          for profile in $(python3 web/make_site.py --profiles); do
            python tools/optimist.py package --profile "$profile" --out dist
          done
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.12                      # (the Simulator tab: tools/sim.py --wasm; docs/WEB.md)
      - name: The simulator of each flavour (web/flavours.json "sim")
        run: |
          for profile in $(python3 web/make_site.py --profiles); do
            python tools/sim.py build --wasm --config "config/profiles/$profile.config" --out "dist/optimist-sim-$profile.wasm"
          done
      - name: The published releases' packages (no draft, no pre-release; the cloud builds are one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p releases
          gh release list --limit 30 --json tagName,isDraft,isPrerelease,publishedAt \
            --jq '.[] | select((.isDraft | not) and (.isPrerelease | not)) | "\(.tagName) \(.publishedAt)"' |
          while read -r tag date; do
            case "$tag" in v[0-9]*) ;; *) echo "skipped: $tag (not a v tag)"; continue ;; esac
            mkdir -p "releases/$tag"
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha) || sha=""   # (the tag's commit: the builder reads that version)
            printf '{"tag": "%s", "date": "%s", "sha": "%s"}\n' "$tag" "$date" "$sha" > "releases/$tag/release.json"
            gh release download "$tag" --pattern 'optimist-*.fwsc' --dir "releases/$tag" || echo "::warning::$tag: no packages"
          done
          ls -R releases
      - name: The latest release's simulators, built from its tag's own source (the Simulator tab starts on them)
        # (the tag's config/profiles and tools/sim.py are that release's; one checkout of the tag beside this one)
        run: |
          python3 web/make_site.py --release-sims releases | while read -r tag sha profile; do
            src="worktrees/release-$tag"
            if [ ! -d "$src" ]; then
              git fetch --no-tags --depth 1 origin "+refs/tags/$tag:refs/tags/$tag" < /dev/null
              git worktree add --detach "$src" "$sha" < /dev/null || { echo "::warning::$tag: no checkout of $sha"; continue; }
            fi
            cfg="config/profiles/$profile.config"
            if [ ! -f "$src/$cfg" ]; then echo "::warning::$tag: no $cfg at the tag"; continue; fi
            (cd "$src" && python tools/sim.py build --wasm --config "$cfg" --out "$GITHUB_WORKSPACE/releases/$tag/optimist-sim-$profile.wasm" < /dev/null) \
              || echo "::warning::$tag: the simulator of $profile did not build"
          done
          ls -l releases/*/
      - name: Make the site
        env:
          OPTIMIST_SOURCE_REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}   # the page's Source link: the tag
        run: |
          python3 web/make_site.py --flavours web/flavours.json "$(tr -d '[:space:]' < VERSION)" site --releases releases
          touch site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
          retention-days: 1

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write                       # (to delete the older site artifacts below)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Keep only the newest site artifact (the older ones are deployed already; storage is billed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=100" --jq '.artifacts | sort_by(.created_at) | reverse | .[1:] | .[].id' | while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
