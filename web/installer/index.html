<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only
     The standalone installer page (webapp/installer/ on the site): the shared header and style, and the installer module
     (web/installer/installer.js) mounted in <main>. web/make_site.py puts in the style, the header, the module (with
     web/fm1ota.js, web/fm1pkg.js and web/installer/installer.css inlined) and the site's packages, so the page is one
     standalone, offline file. docs/WEB.md. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="initial-scale=1, width=device-width">
<title>Optimist installer</title>
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="stylesheet" href="https://w0ts.github.io/site-style/common.css">
<style>/*OPTIMIST-CSS*/</style>
<style>.oi { max-width: none; }   /* (the content is the page width, 1100 px, the header's) */</style>
</head>
<body>
<!--OPTIMIST-HEADER-->
<main class="page" id="installer"><noscript>The installer needs JavaScript, and Chrome or Edge (Web MIDI).</noscript></main>
<script type="module">
/*INSTALLER*/
const site = /*META*/;                               /* { version, source, packages: [{ id, title, description, pkg, product, sha256 }] } */
window.optimistInstaller = mountInstaller(document.getElementById("installer"), { ...site, heading: false });   /* (the page header holds the title) */
</script>
</body>
</html>
