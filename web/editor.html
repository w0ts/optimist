<!-- Felucca web editor. One file, no libraries. Protocol: EDITOR_PROTOCOL.md.
     Add ?mock=1 to the URL to use a built-in simulated device. -->
<html lang="en" data-conn="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimist Editor</title>
<style>
  /* Fukiai: Hügelton Instruments' icon font (MIT, FUKIAI-LICENSE.txt). Icons are text in .ic spans;
     they stay hidden until the face has loaded (html.fk), so a missing font never shows boxes. */
  @font-face { font-family: "Fukiai"; src: url("fukiai.ttf") format("truetype"); font-display: block; unicode-range: U+EA00-EB09; }
  :root { --bg: #fff; --fg: #000; --dim: #666; --line: #ccc; --panel: var(--bg); --accent: var(--fg);
          --ok: #2e9e5b; --warn: #c98a12; --err: #d23c3c; }   /* status: green OK / live, amber notice, red error or distortion */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --fg: #fff; --dim: #888; --line: #444; }
  }
  :root[data-theme="dark"] { --bg: #000; --fg: #fff; --dim: #888; --line: #444; }
  html { color-scheme: light dark; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
         font-variant-numeric: tabular-nums; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 4px; padding-bottom: 2px; border-bottom: 1px solid var(--fg); }
  h3 { font-size: 11px; font-weight: 400; color: var(--dim); margin: 4px 0 0; }
  a { color: inherit; }
  button { font: inherit; background: var(--fg); color: var(--bg); border: 0; padding: 2px 10px; cursor: pointer; }
  button:disabled { opacity: .3; cursor: default; }
  select, input[type=text], input[type=number], input[type=search] {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 1px 3px; border-radius: 0; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--fg); }
  input[type=checkbox] { accent-color: var(--fg); margin: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 0 0 8px; }
  .dim { color: var(--dim); }
  #status { min-height: 1.4em; }
  section { margin: 12px 0; }
  .groups { columns: 250px; column-gap: 20px; }
  .group { break-inside: avoid; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 46px 1fr 70px; gap: 6px; align-items: center; min-height: 22px; }
  .row .v { text-align: right; white-space: nowrap; }
  .row select { width: 100%; }
  .browser { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .browser select[size] { min-width: 150px; }
  table.snaps td { padding: 2px 8px 2px 0; vertical-align: middle; }
  table.snaps td.nm { min-width: 9em; font-weight: 600; }
  table.snaps button { margin: 0 2px; }
  .slots { display: grid; grid-template-columns: auto auto auto auto; gap: 3px 8px; align-items: center; justify-content: start; }
  table { border-collapse: collapse; }
  th { font-weight: 400; color: var(--dim); text-align: left; padding: 0 6px 2px 0; }
  td { padding: 1px 6px 1px 0; }
  td.i { color: var(--dim); text-align: right; }
  .smp { margin: 0 0 14px; padding: 6px 0 0; border-top: 1px solid var(--line); }
  .smp.over { outline: 1px solid var(--fg); outline-offset: 2px; }
  .smp .head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .smp .head b { font-weight: 600; min-width: 40px; }
  .smp progress { width: 160px; height: 6px; accent-color: var(--fg); }
  .smp table { margin: 4px 0; }
  .smp input.name { width: 80px; text-transform: uppercase; }
  .smp input.root { width: 48px; }
  .smp .bad { text-decoration: underline wavy; }
  .chop canvas.wave { display: block; width: 100%; height: 150px; margin: 6px 0; border: 1px solid var(--line); cursor: default; touch-action: none; }
  .chop canvas.wave:focus { outline: 1px solid var(--fg); }
  .chop .head { margin: 3px 0; }
  .chop .sep { width: 8px; }
  .chop input.num { width: 56px; }
  .chop input[type=range] { width: 90px; accent-color: var(--fg); }
  .chop button.tap { min-width: 72px; }
  .chop .chops { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
  .chop .chip { background: none; color: var(--fg); border: 1px solid var(--line); padding: 1px 6px; }
  .chop .chip.on { background: var(--fg); color: var(--bg); }
  .chop .chip { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; user-select: none; }
  .chop .chip input { margin: 0; accent-color: var(--fg); }
  .chop .chip.off { color: var(--dim); text-decoration: line-through; }
  .chop .chip.on input { accent-color: var(--bg); }
  .chop input.len { width: 160px; }
  .chop .selrow[hidden] { display: none; }
  footer { margin-top: 24px; font-size: 9.5px; line-height: 1.35; color: var(--dim); }
  .row.pushed .v { font-weight: 600; }
  /* librarian: local library and the device's user bank side by side, stacked on a phone */
  .libcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 8px 24px; margin-top: 6px; }
  .libcols > div { min-width: 0; }
  .libcols .bar input[type=search] { flex: 1 1 120px; min-width: 0; }
  .list { height: 260px; overflow: auto; border: 1px solid var(--line); resize: vertical; }
  .list table { width: 100%; table-layout: fixed; }
  .list th { position: sticky; top: 0; background: var(--bg); padding: 1px 6px; }
  .list td { padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list tr[data-id], .list tr[data-slot], .list tr[data-fm6] { cursor: pointer; }
  .list tr.sel td { background: var(--fg); color: var(--bg); }
  .list tr.empty td { color: var(--dim); }
  .list tr.over td { outline: 1px dashed var(--fg); outline-offset: -1px; }
  .list.over { outline: 1px solid var(--fg); }
  .list .none { padding: 6px; color: var(--dim); }
  .list col.n { width: 40px; } .list col.e { width: 72px; } .list col.d { width: 78px; }
  .ic { font-family: "Fukiai"; font-style: normal; font-weight: 400; font-synthesis: none; line-height: 1; margin-right: .3em; }
  html:not(.fk) .ic { display: none; }
  /* wave choices: a page-drawn picker so the options can carry an icon (Chrome 135+); native menus get words only */
  @supports (appearance: base-select) {
    select.wave, select.wave::picker(select) { appearance: base-select; }
    select.wave { padding: 1px 3px; min-block-size: 0; border: 1px solid var(--line); border-radius: 0; background: var(--bg); color: var(--fg); }
    select.wave > button { font: inherit; background: none; color: inherit; padding: 0; text-align: start; }
    select.wave::picker(select) { border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0; }
    select.wave option { padding: 1px 6px; min-block-size: 0; }
    select.wave option:checked { font-weight: 600; }
    select.wave option:hover, select.wave option:focus-visible { background: var(--fg); color: var(--bg); }
    select.wave option::checkmark { display: none; }
  }
  /* tabs: a wrapping row of plain buttons, the open one inverted; header stays at the top on wide screens */
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 4px 0 0; }
  @media (max-width: 600px) { .top { position: static; } }
  .tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--fg); margin: 6px 0 0; }
  .tabs button { background: none; color: var(--dim); padding: 4px 10px; border: 1px solid transparent; border-bottom: 0; white-space: nowrap; }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
  .trackbar { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; flex-wrap: wrap; }
  .seg button, button.tog { background: var(--bg); color: var(--fg); border: 1px solid var(--fg); padding: 1px 10px; }
  .seg button + button { border-left: 0; }
  .seg button[aria-pressed="true"], button.tog[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .panel { margin: 12px 0; }
  .hint { margin: 16px 0; color: var(--dim); }
  /* v5: the drum track as 16 lanes x LEN steps; a hit's level by its shade, its ratchet as a number */
  .dgrid { display: grid; gap: 1px; margin: 6px 0 12px; overflow-x: auto; }
  .dgrid .ln { font-size: 10px; color: var(--dim); white-space: nowrap; padding-right: 6px; align-self: center; }
  .dgrid .hd { font-size: 9px; color: var(--dim); }
  .dgrid .gap { grid-column: 1 / -1; height: 8px; }
  .dgrid button { background: var(--bg); color: var(--bg); border: 1px solid var(--line); padding: 0; min-width: 16px; height: 18px;
                  font-size: 9px; line-height: 1; font-weight: 700; }
  .dgrid button.beat { border-left-color: var(--dim); }
  .dgrid button.bar { border-left-color: var(--fg); }
  .dgrid button.on { background: var(--kc, var(--fg)); border-color: var(--kc, var(--fg)); color: #000; opacity: .85; }
  .dgrid button.on.l1 { opacity: .3; }
  .dgrid button.on.l2 { opacity: .6; }
  .dgrid button.on.l3 { opacity: 1; box-shadow: 0 0 0 1px var(--fg); }
  .dgrid button.now { outline: 2px solid var(--accent); outline-offset: -2px; }
  .dgrid .hd.now { color: var(--fg); font-weight: 700; }
  .dgrid .hd.bar { color: var(--fg); }
  .dgrid .ln { border-left: 4px solid var(--kc, var(--line)); padding-left: 4px; }
  /* the piano roll: header (numbers, ACC, SLIDE), the keys and notes (scrolls), velocity, the picked step's panel */
  .roll { margin: 6px 0 12px; }
  .roll canvas { display: block; touch-action: none; }
  .roll .rhead, .roll .rvel { margin-left: 1px; cursor: pointer; }
  .roll .rscroll { height: 340px; overflow-y: auto; overflow-x: hidden; border: 1px solid var(--line); }
  .roll .rgrid { cursor: crosshair; outline: none; }
  .roll .rgrid:focus-visible { outline: 1px solid var(--fg); }
  .roll .rpanel { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 0; min-height: 30px; }
  .roll .rnote { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line); padding: 2px 6px; }
  .roll .rnote button { padding: 0 6px; }
  .roll input.num { width: 4.2em; }
  .strip .solo { font-size: 11px; font-weight: 600; visibility: hidden; }
  .strip .solo.on { visibility: visible; }
  /* mixer: four channel strips as on the device's TRACKS page */
  .mixer { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 8px; margin: 6px 0; overflow-x: auto; }
  .strip { border: 1px solid var(--line); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .strip.sel { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  .strip .num { font-size: 18px; font-weight: 600; line-height: 1; }
  .strip .snd { font-size: 11px; line-height: 1.3; width: 100%; text-align: center; overflow-wrap: anywhere; min-height: 2.6em; }
  .strip .rec { font-size: 11px; color: var(--dim); }
  .strip .rec.on { color: var(--fg); font-weight: 600; }
  .strip .rec:not(.on) .ic { visibility: hidden; }
  .strip input.fader { writing-mode: vertical-lr; direction: rtl; width: 28px; height: 150px; }
  .strip .v { font-size: 11px; white-space: nowrap; }
  .strip .pan { width: 100%; }
  .strip.muted .fader, .strip.muted .lv { opacity: .35; }
  .strip button { width: 100%; padding: 1px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sysinfo th { padding-right: 16px; }
  [hidden] { display: none !important; }
  /* not connected: the connect card only (html[data-conn=off], renderPanels) */
  html[data-conn=off] .panel, html[data-conn=off] .tbar > :not(.theme):not(#mock), html[data-conn=off] #status,
  html[data-conn=off] #hint { display: none !important; }
  html:not([data-conn=off]) #connectcard { display: none; }
  .connectcard { max-width: 460px; margin: 12vh auto 0; text-align: center; }
  .connectcard .clogo { font-size: 34px; letter-spacing: .02em; margin: 0 0 18px; }
  .connectcard #cstatus { min-height: 1.4em; }
  .connectcard #cstatus[data-st=err] { color: var(--err); }
  .connectcard #cstatus[data-st=warn] { color: var(--warn); }
  /* ---- the DAW layout: transport bar, mixer strips, popups (colours: var(--eng) = the engine's / kind's, set by script) */
  body { background: var(--bg); }
  .tbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--fg); }
  .tbar .brand { font-size: 16px; }
  .tbar .tabs { border: 0; margin: 0; }
  .tbar .inst { font-size: 11px; }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 9px; border: 1px solid var(--line); }
  .pill:empty { display: none; }
  .pill[data-st=ok] { border-color: var(--ok); color: var(--ok); }
  .pill[data-st=warn] { border-color: var(--warn); color: var(--warn); }
  .pill[data-st=err] { border-color: var(--err); color: var(--err); }
  button.pill { background: none; color: var(--fg); cursor: pointer; }
  button.pill[data-st=ok] { color: var(--ok); } button.pill[data-st=warn] { color: var(--warn); }
  .flash { outline: 2px solid var(--accent); outline-offset: 3px; transition: outline-color .6s; }
  .tp { display: inline-flex; gap: 6px; align-items: center; }
  .tp #play[aria-pressed=true] { background: var(--ok); border-color: var(--ok); color: var(--bg); }
  .tp input { width: 4.5em; }
  .strip { background: var(--panel); align-items: stretch; }
  .strip .shead { display: flex; align-items: center; gap: 6px; background: var(--eng, var(--line)); color: var(--engfg, var(--fg)); padding: 3px 5px;
                  width: 100%; min-height: 30px; border: 0; text-align: left; cursor: pointer; font: inherit; }
  .strip button.shead { white-space: nowrap; }
  .strip .shead:hover { filter: brightness(1.08); }
  .strip .shead:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
  .strip .shead .num { font-size: 16px; font-weight: 700; padding: 0 4px; }
  .strip .shead .selm { margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .06em; visibility: hidden; }
  .strip.sel .shead .selm { visibility: visible; }
  .strip .shead .eng { font-size: 11px; font-weight: 600; letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strip.sel { outline: 2px solid var(--accent); outline-offset: -1px; }
  /* row 1: the strip's editors in ONE bordered group (synth: Sound, Load, Save; drums: Kit, User kits); row 2: Sequence */
  .strip .pops { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(32px, 1fr); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--bg); }
  .strip .pops button.ib { width: auto; border: 0; border-radius: 0; background: transparent; }
  .strip .pops button.ib + button.ib { border-left: 1px solid var(--line); }
  .strip .pops button.ib:hover { background: var(--panel); }
  .keyhelp td { padding: 2px 10px 2px 0; vertical-align: top; }
  .keyhelp kbd { font: inherit; font-size: 11px; padding: 0 5px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); }
  .strip button.ib.seqb { width: 100%; justify-content: flex-start; padding: 0 8px; gap: 6px; }
  button.ib { width: 32px; min-width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; gap: 3px;
              background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
  button.ib:hover { border-color: var(--fg); }
  button.ib[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  button.ib span { font-size: 11px; }
  .tabs .si, h2 .si { width: 15px; height: 15px; vertical-align: -2px; margin-right: .3em; }
  .si { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #play .si { fill: currentColor; }
  .strip .row2 { align-items: center; }
  .strip .fx button.tog { width: auto; padding: 1px 8px; }
  .strip .lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; }
  .strip .lanes .ln { font-size: 8.5px; padding: 3px 1px; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
                      border-left: 4px solid var(--kc, var(--line)); text-align: left; overflow: hidden; text-overflow: ellipsis; }
  .strip .lanes .ln.ed { font-weight: 700; }
  .ov { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 1px; cursor: pointer; min-height: 6px; }
  .ov i { height: 6px; background: var(--line); opacity: .45; }
  .ov i.beat { opacity: .7; }
  .ov i.on { background: var(--eng, var(--fg)); opacity: 1; }
  .strip .ov i.on { background: var(--fg); }
  .ov i.now { outline: 2px solid var(--accent); outline-offset: -1px; opacity: 1; }
  .strip .row2 { display: flex; justify-content: space-between; gap: 4px; }
  .strip .fm { display: flex; justify-content: center; gap: 4px; align-items: stretch; }
  /* the meters (v9 STREAM): green, amber above -6 dB, red at clip; the hold line; a tick at 0 dBFS (-60..+6 dB) */
  .meter { width: 8px; height: 150px; background: var(--line); position: relative; overflow: hidden; align-self: center; }
  .meter i.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--ok); }
  .meter[data-st=warn] i.bar { background: var(--warn); }
  .meter[data-st=err] i.bar { background: var(--err); }
  .meter b.hold { position: absolute; left: 0; right: 0; height: 2px; bottom: 0; background: var(--ok); }
  .meter b.hold[data-st=warn] { background: var(--warn); }
  .meter b.hold[data-st=err] { background: var(--err); }
  .meter u.zero { position: absolute; left: 0; right: 0; height: 1px; bottom: 90.9%; background: var(--fg); opacity: .35; }
  .strip.master .fm { margin-top: 8px; }
  .strip .knob { align-self: center; }
  .strip.master .mk { justify-content: center; }
  dialog#pop { width: min(1100px, 96vw); max-height: 90vh; padding: 0; border: 1px solid var(--fg); background: var(--bg); color: var(--fg); }
  dialog#pop::backdrop { background: rgba(0, 0, 0, .45); }
  .pophead { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; padding: 6px 10px; background: var(--panel);
             border-bottom: 1px solid var(--line); }
  .pophead h2 { border: 0; margin: 0; flex: 1; font-size: 15px; }
  .pophead .trackbar { border: 0; padding: 0; }
  .popx { font-size: 20px; line-height: 1; padding: 2px 10px; }
  #popbody { padding: 8px 12px 14px; }
  #popbody .panel { margin: 0; }
  #popbody .stitle { display: none; }
  .panel.loading { opacity: .5; }
  .pgroup { margin: 0 0 10px; }
  .pgroup .ehead { background: var(--eng); color: var(--engfg); padding: 2px 6px; border: 0; }
  .plist { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
  .plist .pr { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-left: 4px solid var(--kc, var(--eng, var(--line))); }
  .plist .pr.cur { background: var(--fg); color: var(--bg); }
  table.dlanes input.num { width: 4.2em; }
  table.dlanes td, table.dlanes th { padding: 1px 4px; white-space: nowrap; }
  table.dlanes select { max-width: 9em; }
  table.ukits tr.cur td { font-weight: bold; }
  /* knobs: drag up / down, the wheel, the arrow keys; the value under the knob */
  .knob { display: inline-flex; flex-direction: column; align-items: center; width: 54px; gap: 1px; cursor: ns-resize; user-select: none;
          touch-action: none; outline: none; }
  :root { --knob-size: 40px; --knob-track: var(--line); --knob-value: var(--fg); --knob-pointer: var(--fg); --knob-stroke: 3; }
  .knob svg { width: var(--knob-size); height: var(--knob-size); display: block; }
  .knob .tr { fill: none; stroke: var(--knob-track); stroke-width: var(--knob-stroke); }
  .knob .va { fill: none; stroke: var(--knob-value); stroke-width: var(--knob-stroke); }
  .knob .pt { stroke: var(--knob-pointer); stroke-width: 2; stroke-linecap: round; }
  .knob .kl { font-size: 10px; color: var(--dim); white-space: nowrap; }
  .knob .kv { font-size: 11px; white-space: nowrap; }
  .knob:focus-visible svg { outline: 1px solid var(--fg); outline-offset: 1px; }
  .knob.off { opacity: .3; pointer-events: none; }
  .knob[data-st=warn] .va, .knob[data-st=warn] .pt { stroke: var(--warn); }
  .knob[data-st=err] .va, .knob[data-st=err] .pt { stroke: var(--err); }
  .knobs { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: flex-start; }
  .knobs + .knobs { margin-top: 6px; }
  /* the Mix tab's sends: four knobs a strip (the drum track: its REV) */
  .strip .fx { display: grid; grid-template-columns: repeat(2, 54px); justify-content: center; gap: 4px 0; border-top: 1px solid var(--line);
               padding-top: 6px; width: 100%; }
  .strip .fx .note { grid-column: 1 / -1; font-size: 10px; color: var(--dim); text-align: center; }
  .strip .fx button { grid-column: 1 / -1; }
  .strip.dry .fx .knob { opacity: .4; }
  /* the kit editor: 16 lanes, then the selected lane's source, sound and sends */
  .kitbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 6px 0 10px; }
  .klanes { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; margin: 0 0 10px; }
  @media (max-width: 600px) { .klanes { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .klanes button { background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 3px 4px; text-align: left; min-width: 0;
                   display: flex; flex-direction: column; gap: 1px; font-size: 11px; line-height: 1.2; }
  .klanes button .k { font-size: 9px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .klanes button .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .klanes button.ed .n::after { content: " \2022"; }
  .klanes button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .klanes button[aria-pressed="true"] .k { color: inherit; opacity: .7; }
  .klane { border: 1px solid var(--line); padding: 8px; display: grid; gap: 8px; }
  .klane .hd { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .klane .hd b { font-size: 15px; min-width: 80px; }
  .klane .hd select { max-width: 16em; }
  .klane h3 { margin: 0 0 2px; }
  .klane .usr { display: grid; grid-template-columns: 46px 1fr 60px; gap: 4px 8px; align-items: center; max-width: 420px; }
  #dlanes { margin-top: 12px; }
  /* the Sound tab: the track and its sound; enums beside the knobs; the drum track's panel */
  .stitle { font-size: 15px; border-bottom: 0; margin: 0 0 8px; }
  .pk { display: inline-flex; flex-direction: column; gap: 2px; min-width: 54px; max-width: 120px; }
  .pk select { max-width: 120px; }
  .pk .kl { font-size: 10px; color: var(--dim); }
  .groups .group .knobs { margin: 2px 0 6px; }
  button.big { padding: 6px 14px; font-size: 14px; }
  #drumsound select { max-width: 18em; }
  .strip .snd[data-tag]::after { content: " " attr(data-tag); font-size: 9px; color: var(--dim); }
  .tag { font-size: 9px; border: 1px solid var(--line); padding: 0 3px; color: var(--dim); }
</style>

<script>
"use strict";
/*PROTO-BEGIN*/
/* ---------------------------------------------------------------- protocol --- */
const HDR = [0x7D, 0x46, 0x4C];
const CMD = { INFO: 1, GET: 2, SET: 3, DUMP: 4, DESC: 5, STEP_GET: 6, STEP_SET: 7, PRESET: 8, PROJECT: 9, NAMES: 10,
  SMP_BEGIN: 11, SMP_WRITE: 12, SMP_END: 13, SMP_ERASE: 14, SMP_INFO: 15,
  UP_LIST: 16, UP_GET: 17, UP_PUT: 18, UP_STORE: 19, UP_LOAD: 20, UP_ERASE: 21,
  WATCH: 22, CHANGED: 23, RELOAD: 24, PING: 25, STEP_CHANGED: 26,
  TRACK: 27, TRACK_MIX: 28, TRACK_DUMP: 29, TRACK_STEP: 30,
  TRACK_PARAM: 31, TRACK_CHANGED: 32,
  DRUM_STEP: 33,
  DRUM_LANES: 36, DRUM_LANE: 37, UKIT_LIST: 38, UKIT_GET: 39, UKIT_PUT: 40, UKIT_OP: 41, SMP_READ: 42,
  BK_LIST: 43, BK_READ: 44, BK_BEGIN: 45, BK_DATA: 46, BK_COMMIT: 47, BK_END: 48, BUILD: 49,
  DRUM_SRCS: 50, DRUM_SHOW: 51, PAGES: 52, STATUS: 53, SN_LIST: 54, SN_OP: 55, SN_READ: 56, SN_WRITE: 57,
  STREAM: 58, PARAMS: 59, STEPS: 60, LANE: 61, TRACKS: 62, SONG: 63, SYNC_STATS: 64 };
/* frames the device sends on its own (while WATCH is on); never replies. v9 (WATCH bits 2, 3): STREAM .. SONG */
const PUSH = new Set([CMD.CHANGED, CMD.RELOAD, CMD.STEP_CHANGED, CMD.TRACK_CHANGED,
  CMD.STREAM, CMD.PARAMS, CMD.STEPS, CMD.LANE, CMD.TRACKS, CMD.SONG]);
/* WATCH bits: 1 on, 2 TRACK_CHANGED (v4), 4 every track's changes coalesced (v9), 8 the status stream (v9) */
const WATCH = { ON: 1, V4: 2, V9: 4, STREAM: 8, ALL: 15 };
const PARAMS_GLOBAL = 127;                         /* a PARAMS entry's "where" for a global G_* */
/* user preset bank: name 1..12 printable ASCII, a 16-step pattern of (note, flags 1 acc 2 slide 4 tie) */
const UP = { NAME_MAX: 12, PAT: 16, LIST_MAX: 16 };
const F = { INT: 0, PCT: 1, BIPCT: 2, TIME: 3, LFOHZ: 4, CUTOFF: 5, DB: 6, SEMI: 7, ENUM: 8, BPM: 9, NOTE: 10, ONOFF: 11, OCT: 12, STEPS: 13,
  SWING: 14, FILT: 15 };
/* v5 (SLOOP 2.0): the drum track's 16 sounds (firmware drums.c LANE_NOTE / LANE_NAME), one per white key
   F3..G5; a hit has a level (NORM, GHOST, SOFT, HARD: OCT- / OCT+ held on the device) and a ratchet x1..x4 */
const DRUM_LANES = [[36, "KICK"], [35, "KICK 2"], [38, "SNARE"], [39, "CLAP"], [42, "CLOSED HAT"], [46, "OPEN HAT"], [44, "PEDAL HAT"], [37, "RIM"],
  [40, "SNARE 2"], [43, "LOW TOM"], [48, "HI TOM"], [49, "CRASH"], [51, "RIDE"], [70, "SHAKER"], [63, "CONGA"], [56, "COWBELL"]];
const LV_NAMES = ["NORM", "GHOST", "SOFT", "HARD"];
/* the kits (drums.c DRUM_KIT_NAMES; their numbers are stored in projects and user kits; 37 / 38: the X0X kits, 39..46 their
   style kits, built or not) */
const DRUM_KIT_NAMES = ["ACOUSTIC", "DEEP", "TIGHT", "BRIGHT", "DUST", "808", "909", "606", "80S", "VINTAGE", "TRAP", "DRILL", "BOOMBAP", "LO-FI", "PHONK", "HOUSE", "D.HOUSE", "TECHNO", "MINIMAL", "ELECTRO", "DISCO", "GARAGE", "JUNGLE", "DUBSTEP", "DEMBOW", "AMAPIANO", "AFRO", "LATIN", "TRIBAL", "SYNTHWV", "CHIP", "ARCADE", "GLITCH", "INDUSTR", "HYPER", "AMBIENT", "JAZZ", "X0X 909", "X0X 808",
  "X9 TECH", "X9 HOUSE", "X9 UKG", "X9 ACID", "X8 TRAP", "X8 BOOM", "X8 ELEC", "X8 MIAMI"];
const LV_ORDER = [1, 2, 0, 3];                       /* by loudness: GHOST SOFT NORM HARD (as the device's LEVEL knob) */
/* an empty drum step: no lane on */
const emptyDrum = () => ({ on: 0, lvl: new Array(16).fill(0), rat: new Array(16).fill(0) });

/* drum lanes and user kits (firmware drum_edit.c, drum_kits.c, ed_drums.c; cmds 36..42): every lane of the drum
   track has 8 offsets from its kit's sound, a source (KIT, USR1..3, another kit's sound for it) and a user-sample
   reference (hit = the slot's zone, start / length in 1/1024 of the hit). A firmware without them does not
   answer (the editor asks DRUM_LANES once, with a short timeout). Version 2 of 36 / 37 / 39 / 40 (drum_sends.c,
   ed_dsend.c) adds each lane's sends: REV (-1 = TRK, the drum track's REV; 0..31), DLY, CHO (0..31), 3 bytes a
   lane after the lanes / the kit; a firmware without them does not answer 36 v2 (the editor asks it first) */
const DL = { LANE: 12, BLOCK: 204, KIT: 196, KIT1: 204, NKIT: 16, NAME: 8, USR: 1, KIT0: 16, X909: 64, X808: 80,
  LANE2: 15, BLOCK2: 252, KIT2: 244, V2: 0x40, LV_MAX: 31,
  DE: ["TUNE", "DECAY", "SNAP", "CLICK", "BEND", "CUT", "DRIVE", "LEVEL"],
  MIN: [-24, -64, -64, -64, -24, -64, -64, -24], MAX: [24, 63, 63, 63, 24, 63, 63, 6],
  SAMPLED: [true, true, false, false, false, true, false, true],   /* what a sampled sound uses */
  USR3_KIB: 64 };
/* the X0X voices a lane can play (firmware drum_edit.c DL_X909 + v, DL_X808 + s: any voice of X0X's 909 or 808 on any
   lane; a firmware without the machine plays the synthesised 909 / 808 for it): [name, src] */
const X0X_VOICES = [...["BD", "SD", "LT", "MT", "HT", "RS", "CP", "CH", "OH", "CR", "RD"].map((v, i) => ["909 " + v, DL.X909 + i]),
  ...["BD", "SD", "LT", "MT", "HT", "LC", "MC", "HC", "RS", "CL", "MA", "CP", "CB", "CH", "OH", "CY"].map((v, i) => ["808 " + v, DL.X808 + i])];                                   /* USR3 gave its last 16 KiB to the banks (FM6, kits) */
const s8 = (x) => ((x & 0xFF) ^ 0x80) - 0x80;
const clampDE = (i, v) => Math.max(DL.MIN[i], Math.min(DL.MAX[i], Math.round(v) || 0));
/* the reference's three bytes <-> {hit, start, len} (len 1..1024; 1024 is stored as 0) */
const refFrom = (r0, r1, r2) => ({ hit: r0 >> 4, start: ((r0 & 15) << 6) | (r1 >> 2), len: (((r1 & 3) << 8) | r2) || 1024 });
function refBytes(x) {
  const st = Math.max(0, Math.min(1023, x.start | 0)), ln = (x.len | 0) >= 1024 || (x.len | 0) <= 0 ? 0 : x.len | 0;
  return [((x.hit & 15) << 4) | (st >> 6), ((st & 63) << 2) | (ln >> 8), ln & 0xFF];
}
/* a lane's sends (v2): REV -1 = TRK or 0..31, DLY and CHO 0..31; 3 bytes, REV signed */
const emptySnd = () => ({ rev: -1, dly: 0, cho: 0 });
const clampSnd = (v, lo) => Math.max(lo, Math.min(DL.LV_MAX, Math.round(+v) || 0));
const sndFrom = (b, o) => ({ rev: clampSnd(s8(b[o]), -1), dly: clampSnd(b[o + 1], 0), cho: clampSnd(b[o + 2], 0) });
const sndBytes = (x) => [clampSnd((x || emptySnd()).rev ?? -1, -1) & 0xFF, clampSnd((x || {}).dly, 0), clampSnd((x || {}).cho, 0)];
const sndFix = (x) => sndFrom(sndBytes(x), 0);
const emptyLane = () => ({ ofs: new Array(8).fill(0), src: 0, hit: 0, start: 0, len: 1024, snd: emptySnd() });
/* a lane as DRUM_LANE sends it: 8 offsets, src, reference (v2: then its sends) */
function laneFrom(b, o = 0) {
  return { ofs: Array.from({ length: 8 }, (_, i) => s8(b[o + i])), src: b[o + 8], ...refFrom(b[o + 9], b[o + 10], b[o + 11]),
    snd: b.length >= o + DL.LANE2 ? sndFrom(b, o + 12) : emptySnd() };
}
const laneBytes = (l, v2 = false) => [...l.ofs.map((v, i) => clampDE(i, v) & 0xFF), l.src & 0xFF, ...refBytes(l),
  ...(v2 ? sndBytes(l.snd) : [])];
const nameFrom = (b, o) => String.fromCharCode(...b.slice(o, o + DL.NAME).filter((c) => c)).replace(/[^\x20-\x7E]/g, "");
const nameBytes = (s) => Array.from({ length: DL.NAME }, (_, i) => (String(s || "").charCodeAt(i) || 0) & 0x7F);
/* the project's 204 bytes (dlanes_t): ofs[16][8], src[16], ref[16][3], ukit, name[8], 3 spare; v2: 252, then
   the 16 lanes' sends (3 bytes each) */
function lanesFrom(b) {
  const lanes = Array.from({ length: 16 }, (_, l) => ({ ofs: Array.from({ length: 8 }, (_, i) => s8(b[l * 8 + i])), src: b[128 + l],
    ...refFrom(b[144 + l * 3], b[145 + l * 3], b[146 + l * 3]), snd: b.length >= DL.BLOCK2 ? sndFrom(b, DL.BLOCK + l * 3) : emptySnd() }));
  return { lanes, ukit: b[192], name: nameFrom(b, 193) };
}
function lanesBytes(o, v2 = false) {
  const b = new Array(v2 ? DL.BLOCK2 : DL.BLOCK).fill(0);
  o.lanes.forEach((l, k) => { laneBytes(l).forEach((x, i) => { if (i < 8) b[k * 8 + i] = x; else if (i === 8) b[128 + k] = x; else b[144 + k * 3 + i - 9] = x; });
    if (v2) sndBytes(l.snd).forEach((x, i) => { b[DL.BLOCK + k * 3 + i] = x; }); });
  b[192] = o.ukit | 0;
  nameBytes(o.name).forEach((c, i) => { b[193 + i] = c; });
  return b;
}
/* a user kit's 196 bytes (drum_kits.c ukit_t): used (0xA5), base kit, src[16], ref[16][3], ofs[16][8], 2 spare;

    r = parse[CMD.SN_WRITE](await rq(req.snData(slot, off, c), { timeout: 1500, retries: 1 }));
    if (r.rc === 12 && ++tries <= 2) continue;
    if (r.rc) throw rcErr(`import ${off}`, r.rc);
    tries = 0;
    off += c.length;
    if (prog) prog(off / stream.length);
  }
  r = parse[CMD.SN_WRITE](await rq(req.snCommit(slot), { timeout: 4000, retries: 0 }));
  if (r.rc) throw rcErr("import", r.rc);
}

const v14enc = (v) => { const u = Math.max(-8192, Math.min(8191, Math.round(v))) + 8192; return [u & 0x7F, (u >> 7) & 0x7F]; };
const v14dec = (lo, hi) => (lo | (hi << 7)) - 8192;
function strEnc(s) { const a = []; for (const c of String(s)) a.push(c.charCodeAt(0) & 0x7F); a.push(0); return a; }

/* only ever builds F0 7D 46 4C ... F7 */
function frame(cmd, args = []) {
  for (const b of args) if (!(Number.isInteger(b) && b >= 0 && b <= 0x7F)) throw new Error("bad data byte " + b);
  return [0xF0, ...HDR, cmd & 0x7F, ...args, 0xF7];
}
/* -> {cmd, a} or null when it is not an editor frame */
function unframe(d) {
  if (!d || d.length < 6 || d[0] !== 0xF0 || d[d.length - 1] !== 0xF7) return null;
  if (d[1] !== HDR[0] || d[2] !== HDR[1] || d[3] !== HDR[2]) return null;
  return { cmd: d[4], a: Array.from(d.slice(5, d.length - 1)) };
}

class Reader {
  constructor(a) { this.a = a; this.i = 0; }
  b() { if (this.i >= this.a.length) throw new Error("short reply"); return this.a[this.i++]; }
  v() { const lo = this.b(); return v14dec(lo, this.b()); }
  s() { let s = ""; for (;;) { const c = this.b(); if (!c) return s; s += String.fromCharCode(c); } }
}

/* v5 steps end with level / ratchet (2 bits per note, 7-bit bytes: lvl, hi (bit 0 lvl, bit 1 rat), rat) */
function stepExt(r, a, o) {
  if (r.i + 3 <= a.length) {
    const lo = r.b(), hi = r.b(), rt = r.b();
    o.lvl = lo | ((hi & 1) << 7);
    o.rat = rt | (((hi >> 1) & 1) << 7);
  }
  return o;
}

const parse = {
  [CMD.INFO](a) {
    const r = new Reader(a);
    const o = { version: r.s(), nengines: r.b(), pcount: r.b(), gcount: r.b(), nstep: r.b(), pe0: r.b(), engines: [] };
    for (let i = 0; i < o.nengines; i++) o.engines.push(r.s());
    o.ntrk = r.i < a.length ? r.b() : 0;             /* v3: tracks (0 = older firmware, one instrument) */
    o.proto = r.i < a.length ? r.b() : 0;            /* v5: the protocol version (0 = older firmware) */
    o.uids = [];                                     /* v6: each engine slot's stable UID (firmware registry.h) */
    for (let i = 0; o.proto >= 6 && i < o.nengines && r.i < a.length; i++) o.uids.push(r.b());
    o.syncCaps = 0;                                  /* then tagged blocks (id, length, bytes); 53: live sync, bit 0 */
    while (o.proto >= 6 && r.i + 2 <= a.length) {    /* WATCH while on keeps what is not pushed yet, bit 1 no RELOAD */
      const id = r.b(), n = r.b();                   /* after the editor's own PRESET / G_ENGSEL (Felucca 1.0.2 #65) */
      if (r.i + n > a.length) break;
      if (id === 0x53 && n >= 1) o.syncCaps = a[r.i] & 3;
      r.i += n;
    }
    return o;
  },
  [CMD.BUILD](a) {                                   /* v6: profile, .config hash, one bit per registry item */
    const r = new Reader(a);
    const o = { profile: r.s(), hash: 0, bits: [] };
    for (let i = 0; i < 5; i++) o.hash += r.b() * 2 ** (7 * i);
    const n = r.i < a.length ? r.b() : 0;
    for (let i = 0; i < n && r.i < a.length; i++) o.bits.push(r.b());
    return o;
  },
  [CMD.GET](a) { const r = new Reader(a); return { scope: r.b(), id: r.b(), value: r.v() }; },
  [CMD.SET](a) { return parse[CMD.GET](a); },
  /* needs the counts from INFO */
  [CMD.DUMP](a, info) {
    const r = new Reader(a);
    const o = { engine: r.b(), preset: r.b(), p: [], g: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    for (let i = 0; i < info.gcount; i++) o.g.push(r.v());
    return o;
  },
  [CMD.DESC](a) {
    const r = new Reader(a);
    const o = { scope: r.b(), id: r.b(), fmt: r.b(), min: r.v(), max: r.v(), def: r.v(), label: r.s(), unit: r.s(), names: [] };
    if (o.fmt === F.ENUM) for (let i = 0; i <= o.max - o.min && i < 64 && r.i < a.length; i++) o.names.push(r.s());
    return o;
  },
  [CMD.STEP_GET](a) {
    const r = new Reader(a);
    const o = { index: r.b(), n: r.b(), notes: [r.b(), r.b(), r.b(), r.b()], time: r.b(), flags: r.b(), vel: r.b() };
    return stepExt(r, a, o);
  },
  [CMD.STEP_SET](a) { return parse[CMD.STEP_GET](a); },
  [CMD.PRESET](a) { const r = new Reader(a); return { engine: r.b(), preset: r.b() }; },
  [CMD.PROJECT](a) { const r = new Reader(a); return { op: r.b(), slot: r.b(), used: r.b(), busy: a.length > 3 && a[3] === 1 }; },
  [CMD.NAMES](a) {
    const r = new Reader(a);
    const o = { engine: r.b(), names: [] };
    const n = r.b();
    for (let i = 0; i < n; i++) o.names.push(r.s());
    if (!o.names.length) o.names.push("INIT");   /* an engine without a factory preset: its defaults (PRESET 0) */
    o.titles = [];
    try { o.titles.push(r.s(), r.s()); } catch (e) { o.titles = []; }   /* older firmware: no page titles */
    return o;
  },
  [CMD.SMP_BEGIN](a) { const r = new Reader(a); return { slot: r.b(), rc: r.b() }; },
  [CMD.SMP_WRITE](a) { const r = new Reader(a); return { slot: r.b(), offset: r.b() | (r.b() << 7) | (r.b() << 14), rc: r.b() }; },
  [CMD.SMP_END](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.SMP_ERASE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.SMP_INFO](a) {
    const r = new Reader(a);
    const o = { nslots: r.b(), slotKiB: r.b(), slots: [] };
    for (let i = 0; i < o.nslots; i++) o.slots.push({ zones: r.b(), name: r.s(), kib: r.b() });
    o.caps = o.slots.map((u) => (r.i < a.length ? r.b() : o.slotKiB));   /* (drum kits firmware) each slot's KiB */
    return o;
  },
  [CMD.UP_LIST](a) {
    const r = new Reader(a);
    const o = { start: r.b(), count: r.b(), total: r.b(), slots: [] };
    for (let i = 0; i < o.count; i++) o.slots.push({ slot: o.start + i, used: r.b(), engine: r.b(), name: r.s() });
    return o;
  },
  /* needs P_COUNT from INFO */
  [CMD.UP_GET](a, info) {
    const r = new Reader(a);
    const o = { slot: r.b(), used: r.b(), engine: r.b(), name: r.s(), p: [], pattern: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    for (let i = 0; i < UP.PAT; i++) o.pattern.push([r.b(), r.b()]);
    return o;
  },
  [CMD.UP_PUT](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_STORE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_LOAD](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_ERASE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.WATCH](a) { return { on: new Reader(a).b() }; },
  [CMD.CHANGED](a) { return parse[CMD.GET](a); },
  [CMD.RELOAD](a) { const r = new Reader(a); return { engine: r.b(), preset: r.b(), track: r.i < a.length ? r.b() : 0 }; },
  [CMD.PING](a) { return {}; },
  [CMD.STEP_CHANGED](a) { const r = new Reader(a); return { index: r.b(), track: r.i < a.length ? r.b() : 0 }; },
  /* v3: tracks. engine === NENGINES: the drum track */
  [CMD.TRACK](a) {
    const r = new Reader(a);
    const o = { sel: r.b(), ntrk: r.b(), tracks: [] };
    for (let i = 0; i < o.ntrk; i++) o.tracks.push({ engine: r.b(), preset: r.b(), level: r.v(), mute: r.b(), armed: r.b() });
    o.solo = r.i < a.length ? r.b() : 0;             /* v5: the tracks soloed (bit per track) */
    return o;
  },
  [CMD.TRACK_MIX](a) { const r = new Reader(a); return { track: r.b(), level: r.v(), mute: r.b() }; },
  [CMD.TRACK_DUMP](a, info) {
    const r = new Reader(a);
    const o = { track: r.b(), engine: r.b(), preset: r.b(), p: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    return o;
  },
  [CMD.TRACK_STEP](a) {
    const r = new Reader(a);
    return stepExt(r, a, { track: r.b(), index: r.b(), n: r.b(), notes: [r.b(), r.b(), r.b(), r.b()], time: r.b(), flags: r.b(), vel: r.b() });
  },
  /* v5: the drum track's step: the lanes on (16 bits), their levels and ratchets (2 bits each) */
  [CMD.DRUM_STEP](a) {
    const r = new Reader(a);
    const o = { index: r.b(), on: r.b() | (r.b() << 7) | ((r.b() & 3) << 14), lvl: [], rat: [] };
    let lv = 0, rt = 0;
    for (let k = 0; k < 5; k++) lv += r.b() * 2 ** (7 * k);
    for (let k = 0; k < 5; k++) rt += r.b() * 2 ** (7 * k);
    for (let l = 0; l < 16; l++) {
      const on = (o.on >> l) & 1;
      o.lvl.push(on ? Math.floor(lv / 4 ** l) % 4 : 0);
      o.rat.push(on ? Math.floor(rt / 4 ** l) % 4 : 0);
    }
    return o;
  },
  /* v4: a parameter of any track (the selection stays), and its push for a track that is not selected */
  [CMD.TRACK_PARAM](a) { const r = new Reader(a); return { track: r.b(), id: r.b(), value: r.v() }; },
  [CMD.TRACK_CHANGED](a) { return parse[CMD.TRACK_PARAM](a); },
  /* the drum lanes and the user kits (cmds 36..42) */
  /* (v2: 2 then 252 bytes, 289 in all; v1: 204 bytes, 234) */
  [CMD.DRUM_LANES](a) { return a.length === 289 && a[0] === 2 ? { ...lanesFrom(unpack7(a.slice(1))), v2: true } : lanesFrom(unpack7(a)); },
  [CMD.DRUM_LANE](a) { return { lane: a[0] & 15, ...laneFrom(unpack7(a.slice(1))) }; },
  [CMD.UKIT_LIST](a) {                              /* 16, used per slot (the first drum kits firmware: a name after each) */
    const r = new Reader(a), n = r.b(), named = a.length > 1 + n, kits = [];
    for (let i = 0; i < n; i++) { kits.push({ slot: i, used: !!r.b(), name: kitName(i) }); if (named) r.s(); }
    return { kits };
  },
  [CMD.UKIT_GET](a) { return { slot: a[0] & 15, ok: !!a[1], kit: kitFrom(unpack7(a.slice(2))) }; },
  [CMD.UKIT_PUT](a) { return { slot: a[0] & 15, rc: a[1] }; },
  [CMD.UKIT_OP](a) { return { slot: a[0], op: a[1], rc: a[2] }; },
  [CMD.SMP_READ](a) { return { slot: a[0], offset: a[1] | (a[2] << 7) | (a[3] << 14), data: unpack7(a.slice(4)) }; },
  /* the drum sources (50): a page of the device's SRC list, each {src, kind (SRC_KIND), name, built}; what a lane's
     SOUND pages show (51): the values (bit per DL.DE), TUNE in steps, a user sample (HIT START LEN) */
  [CMD.DRUM_SRCS](a) {
    const r = new Reader(a), start = r.b(), total = r.b(), n = r.b(), list = [];
    for (let i = 0; i < n; i++) { const src = r.b(), kind = r.b(); list.push({ src, kind: kind & 7, built: !(kind & 8), name: r.s() }); }
    return { start, total, list };
  },
  /* the pages (52): {fam, scope, shown, ids[4] (127 = empty), title} */
  [CMD.PAGES](a) {
    const r = new Reader(a), start = r.b(), total = r.b(), n = r.b(), list = [];
    for (let i = 0; i < n; i++) list.push({ fam: r.b(), scope: r.b(), shown: !!r.b(), ids: [r.b(), r.b(), r.b(), r.b()], title: r.s() });
    return { start, total, list };
  },
  [CMD.STATUS](a) {
    const r = new Reader(a), f = r.b(), bpm = r.v(), sec = r.b(), tracks = [];
    while (r.i + 3 <= a.length) { const step = r.b(), lo = r.b(), hi = r.b(); tracks.push({ step: step === 127 ? -1 : step, peak: lo | (hi << 7) }); }
    return { playing: !!(f & 1), rec: !!(f & 2), ext: !!(f & 4), bpm, section: sec === 127 ? -1 : sec, tracks };
  },
  /* v9 pushes. STREAM: STATUS with the peaks (8192 = 0 dBFS, the largest since the frame before), then the master's;
     info: NTRK (the tracks before the master) */
  [CMD.STREAM](a, info) {
    const n = (info && info.ntrk) || Math.floor((a.length - 6) / 3);
    const o = parse[CMD.STATUS](a.slice(0, 4 + 3 * n));
    o.master = (a[4 + 3 * n] | 0) | ((a[5 + 3 * n] | 0) << 7);
    return o;
  },
  /* PARAMS: [{track (-1: a global), id, value}] */
  [CMD.PARAMS](a) {
    const r = new Reader(a), list = [];
    while (r.i + 4 <= a.length) { const w = r.b(), id = r.b(), value = r.v(); list.push({ track: w === PARAMS_GLOBAL ? -1 : w, id, value }); }
    return list;
  },
  /* STEPS: {track, first, steps}: a synth track's steps as TRACK_STEP gives them, the drum track's as DRUM_STEP */
  [CMD.STEPS](a, info) {
    const track = a[0], first = a[1], n = a[2], drum = !!info && track === info.ntrk - 1, steps = [];
    for (let k = 0, p = 3; k < n; k++) {
      if (drum) { steps.push(parse[CMD.DRUM_STEP]([first + k, ...a.slice(p, p + 13)])); p += 13; }
      else { steps.push(parse[CMD.STEP_GET]([first + k, ...a.slice(p, p + 11)])); p += 11; }
    }
    return { track, first, steps };
  },
  [CMD.LANE](a) { return parse[CMD.DRUM_LANE](a); },
  [CMD.TRACKS](a) { return parse[CMD.TRACK](a); },
  /* SONG: the sections stored (bit per section), the song's parts and loop, the snapshot list's change count */
  [CMD.SONG](a) { return { used: a[0] | (a[1] << 7) | (a[2] << 14), parts: a[3], loop: a[4], snaps: a[5] }; },
  /* SYNC_STATS (64): what the v9 sync cost on the device (a measurement aid) */
  [CMD.SYNC_STATS](a) {
    const f = (k) => rd7(a, 5 * k, 5);
    return { scans: f(0), frames: f(1), bytes: f(2), maxUs: f(3), sumUs: f(4), streamFrames: f(5), halvesSeen: f(6), halvesMissed: f(7) };
  },
  [CMD.DRUM_SHOW](a) {
    const r = new Reader(a.slice(4));
    return { lane: a[0], mask: a[1] | (a[2] << 7), tuneSteps: !!(a[3] & 1), usr: !!(a[3] & 2), name: a.length > 4 ? r.s() : DRUM_LANES[a[0] & 15][1] };
  },
  /* backup / restore (cmds 43..48, ed_backup.c) */
  [CMD.BK_LIST](a) {
    const o = { version: a[0], switches: a[2] | (a[3] << 7), magic: String.fromCharCode(...a.slice(4, 8)), chunk: a[8] | (a[9] << 7), objs: [] };
    let p = 10;
    for (let i = 0; i < a[1] && p + 14 <= a.length; i++, p += 14) {
      const f = a[p + 5];
      o.objs.push({ i, tag: String.fromCharCode(...a.slice(p, p + 4)), kind: BK.KIND[a[p + 4]] || "usr",
        inBuild: !!(f & 1), hasData: !!(f & 2), fm6: !!(f & 8), len: rd7(a, p + 6, 3), crc: rd7(a, p + 9, 5) });
    }
    if (a[0] >= 2 && p + 32 <= a.length) {          /* v2: what the build holds (ed_backup.c bk_caps) */
      const c = { eng: rd7(a, p, 2), kits: rd7(a, p + 2, 5) + rd7(a, p + 7, 1) * 2 ** 35, sets: rd7(a, p + 8, 2), sections: a[p + 10],
        usrCap: [rd7(a, p + 11, 3), rd7(a, p + 14, 3), rd7(a, p + 17, 3)], engAt: rd7(a, p + 20, 2), trk: rd7(a, p + 22, 2),
        kitAt: rd7(a, p + 24, 2), e0At: rd7(a, p + 26, 2), np: a[p + 28], pe0: a[p + 29], slen: a[p + 30], bits: [] };
      for (let i = 0, n = a[p + 31]; i < n && p + 32 + i < a.length; i++) c.bits.push(a[p + 32 + i]);
      o.caps = c;
    }
    return o;
  },
  [CMD.BK_READ](a) { return { i: a[0], off: rd7(a, 1, 3), crc: rd7(a, 4, 5), data: unpack7(a.slice(9)) }; },
  [CMD.BK_BEGIN](a) { return { i: a[0], rc: a[1] }; },
  [CMD.BK_DATA](a) { return { i: a[0], off: rd7(a, 1, 3), rc: a[4] }; },
  [CMD.BK_COMMIT](a) { return { i: a[0], rc: a[1] }; },
  [CMD.BK_END](a) { return { rc: a[0] }; },
  /* snapshots (cmds 54..57, ed_snap.c) */
  [CMD.SN_LIST](a) {
    const r = new Reader(a);
    const o = { version: r.b(), shown: r.b(), nslot: r.b(), sectors: r.b(), free: r.b(), slots: [] };
    o.pay = r.b() | (r.b() << 7);
    o.max = rd7(a, r.i, 3); r.i += 3;
    o.fits = !!r.b();
    for (let k = 0; k < o.nslot && r.i < a.length; k++) {
      const state = r.b(), shown = !!r.b(), size = rd7(a, r.i, 3);
      r.i += 3;
      const name = r.s(), bpm = r.b() | (r.b() << 7), secmask = rd7(a, r.i, 3);
      r.i += 3;
      o.slots.push({ slot: k, state: ["empty", "ok", "bad"][state] || "bad", shown, size, name, bpm, secmask, parts: r.b(), nsec: r.b(),
        other: !!r.b(), motion: !!r.b() });
    }
    return o;
  },
  [CMD.SN_OP](a) { return { op: a[0], slot: a[1], rc: a[2], notes: a[3] || 0 }; },
  [CMD.SN_READ](a) { return { slot: a[0], off: rd7(a, 1, 3), crc: rd7(a, 4, 5), data: unpack7(a.slice(9)) }; },
  [CMD.SN_WRITE](a) { return a[0] === 1 ? { op: 1, slot: a[1], off: rd7(a, 2, 3), rc: a[5] } : { op: a[0], slot: a[1], rc: a[2] }; },
};

/* a name the device accepts: printable ASCII, 1..12 characters */
function upName(s) { return String(s ?? "").replace(/[^\x20-\x7E]/g, "").trim().slice(0, UP.NAME_MAX) || "PATCH"; }

const req = {
  info: () => [CMD.INFO, []],
  get: (scope, id) => [CMD.GET, [scope, id]],
  set: (scope, id, v) => [CMD.SET, [scope, id, ...v14enc(v)]],
  dump: () => [CMD.DUMP, []],
  desc: (scope, id) => [CMD.DESC, [scope, id]],
  stepGet: (i) => [CMD.STEP_GET, [i]],
  stepSet: (i, st) => {
    const n = Math.max(0, Math.min(4, st.n | 0));
    const notes = [0, 1, 2, 3].map((k) => (st.notes[k] | 0) & 0x7F);
    const ext = st.lvl == null && st.rat == null ? []   /* v5: level / ratchet kept (older firmware ignores them) */
      : [(st.lvl | 0) & 0x7F, (((st.lvl | 0) >> 7) & 1) | ((((st.rat | 0) >> 7) & 1) << 1), (st.rat | 0) & 0x7F];
    return [CMD.STEP_SET, [i, n, ...notes, Math.max(0, Math.min(2, st.time | 0)), st.flags & 3, (st.vel | 0) & 0x7F, ...ext]];
  },
  /* v5: get (d == null) or set the drum track's step i: {on: 16 bits, lvl[16], rat[16]} */
  drumStep: (i, d) => {
    if (!d) return [CMD.DRUM_STEP, [i & 0x7F]];
    let lv = 0, rt = 0;
    for (let l = 0; l < 16; l++) if ((d.on >> l) & 1) { lv += ((d.lvl[l] | 0) & 3) * 4 ** l; rt += ((d.rat[l] | 0) & 3) * 4 ** l; }
    const g7 = (x, n) => Array.from({ length: n }, (_, k) => Math.floor(x / 2 ** (7 * k)) & 0x7F);
    return [CMD.DRUM_STEP, [i & 0x7F, ...g7(d.on & 0xFFFF, 3), ...g7(lv, 5), ...g7(rt, 5)]];
  },
  preset: (e, p) => [CMD.PRESET, [e & 0x7F, p & 0x7F]],
  project: (op, slot) => { if (![0, 1, 2].includes(op)) throw new Error("bad PROJECT op"); return [CMD.PROJECT, [op, slot & 3]]; },   /* 0 load, 1 save, 2 query */
  names: (e) => [CMD.NAMES, [e & 0x7F]],
  smpBegin: (s) => [CMD.SMP_BEGIN, [s & 0x7F]],
  smpWrite: (s, off, bytes) => [CMD.SMP_WRITE, [s & 0x7F, off & 0x7F, (off >> 7) & 0x7F, (off >> 14) & 0x7F, ...pack7(bytes)]],
  smpEnd: (s, hdr) => [CMD.SMP_END, [s & 0x7F, ...pack7(hdr)]],
  smpErase: (s) => [CMD.SMP_ERASE, [s & 0x7F]],
  smpInfo: () => [CMD.SMP_INFO, []],
  upList: (start, count) => [CMD.UP_LIST, [start & 0x7F, Math.max(1, Math.min(UP.LIST_MAX, count | 0))]],
  upGet: (s) => [CMD.UP_GET, [s & 0x7F]],
  /* patch: {engine, name, p: P_COUNT values, pattern: 16 x [note, flags]} */
  upPut: (s, pt) => [CMD.UP_PUT, [s & 0x7F, pt.engine & 0x7F, ...strEnc(upName(pt.name)), ...pt.p.flatMap((v) => v14enc(v ?? 0)),
    ...Array.from({ length: UP.PAT }, (_, i) => { const x = (pt.pattern || [])[i] || [0, 0]; return [x[0] & 0x7F, x[1] & 7]; }).flat()]],
  upStore: (s, name) => [CMD.UP_STORE, [s & 0x7F, ...strEnc(name ? upName(name) : "")]],   /* "": the device names it ("ANALOG 07") */
  upLoad: (s) => [CMD.UP_LOAD, [s & 0x7F]],
  upErase: (s) => [CMD.UP_ERASE, [s & 0x7F]],
  /* on: WATCH bits (1 pushes, 2 TRACK_CHANGED (v4), 4 v9 pushes, 8 the status stream); true = 1. A firmware answers the
     bits it knows: v8 at most 3, v3 1 */
  watch: (on) => [CMD.WATCH, [typeof on === "number" ? on & WATCH.ALL : on ? 1 : 0]],
  syncStats: (reset) => [CMD.SYNC_STATS, reset ? [1] : []],
  ping: () => [CMD.PING, []],
  /* v3: tracks 0..3 (3 = drums) */
  track: (sel) => [CMD.TRACK, sel == null ? [] : [sel & 0x7F]],
  trackMix: (tr, level, mute) => [CMD.TRACK_MIX, level == null ? [tr & 0x7F] : [tr & 0x7F, ...v14enc(level), mute ? 1 : 0]],
  trackDump: (tr) => [CMD.TRACK_DUMP, [tr & 0x7F]],
  trackStep: (tr, i, st) => [CMD.TRACK_STEP, st ? [tr & 0x7F, ...req.stepSet(i, st)[1]] : [tr & 0x7F, i & 0x7F]],
  /* v4: get (v == null) or set parameter id (P_*) of track tr, clamped as SET */
  trackParam: (tr, id, v) => [CMD.TRACK_PARAM, v == null ? [tr & 0x7F, id & 0x7F] : [tr & 0x7F, id & 0x7F, ...v14enc(v)]],
  /* the drum lanes: all 16 (get, or set with o = {lanes, ukit, name}); one lane (get, or set with x); v2: with sends */
  drumLanes: (o, v2) => [CMD.DRUM_LANES, v2 ? [2, ...(o ? pack7(lanesBytes(o, true)) : [])] : o ? pack7(lanesBytes(o)) : []],
  drumLane: (l, x, v2) => [CMD.DRUM_LANE, [(l & 15) | (v2 ? DL.V2 : 0), ...(x ? pack7(laneBytes(x, !!v2)) : [])]],
  /* user kits: the list; a kit; write one (k null: erase); op 0 load into the project, 1 erase, 2 store the project's
     lanes */
  ukitList: () => [CMD.UKIT_LIST, []],
  ukitGet: (u, v2) => [CMD.UKIT_GET, [(u & 15) | (v2 ? DL.V2 : 0)]],
  ukitPut: (u, k, v2) => [CMD.UKIT_PUT, [(u & 15) | (v2 ? DL.V2 : 0), ...pack7(k ? kitBytes(k, !!v2) : new Array(v2 ? DL.KIT2 : DL.KIT).fill(0))]],
  ukitOp: (u, op) => [CMD.UKIT_OP, [u & 15, op & 3]],
  /* n (<= 256) bytes of user slot k's flash from off (a kit's samples, exported) */
  smpRead: (k, off, n) => [CMD.SMP_READ, [k & 0x7F, off & 0x7F, (off >> 7) & 0x7F, (off >> 14) & 0x7F, n & 0x7F, (n >> 7) & 0x7F]],
  /* the drum sources from entry start on; what lane l's SOUND pages show */
  drumSrcs: (start) => [CMD.DRUM_SRCS, [start & 0x7F]],
  drumShow: (l) => [CMD.DRUM_SHOW, [l & 15]],
  pages: (start) => [CMD.PAGES, [start & 0x7F]],
  /* the transport and meters; op 1 PLAY, 2 STOP */
  status: (op) => [CMD.STATUS, op ? [op & 3] : []],
  /* backup / restore: the object list; a chunk of object i; write object i (BEGIN, DATA chunks, COMMIT); end (1: done,
     the device restarts; 0: abort) */
  bkList: () => [CMD.BK_LIST, [BK.VERSION]],
  bkRead: (i, off) => [CMD.BK_READ, [i & 0x7F, ...wr7(off, 3)]],
  bkBegin: (i, len, crc) => [CMD.BK_BEGIN, [i & 0x7F, ...wr7(len, 3), ...wr7(crc, 5)]],
  bkData: (i, off, bytes) => [CMD.BK_DATA, [i & 0x7F, ...wr7(off, 3), ...wr7(crc32(bytes), 5), ...pack7(bytes)]],
  bkCommit: (i) => [CMD.BK_COMMIT, [i & 0x7F]],
  bkEnd: (done) => [CMD.BK_END, [done ? 1 : 0]],
  /* snapshots: the list; op 0 save (name: "" made from the work), 1 load, 2 clear, 3 rename; a chunk of a slot's stream;
     an import (begin, data, commit, abort) */
  snList: () => [CMD.SN_LIST, [SN.VERSION]],
  snOp: (op, slot, name = "") => [CMD.SN_OP, [op & 3, slot & 0x7F, ...[...String(name).slice(0, 12)].map((c) => c.charCodeAt(0) & 0x7F), 0]],
  snRead: (slot, off) => [CMD.SN_READ, [slot & 0x7F, ...wr7(off, 3)]],
  snBegin: (slot, len, crc) => [CMD.SN_WRITE, [0, slot & 0x7F, ...wr7(len, 3), ...wr7(crc, 5)]],
  snData: (slot, off, bytes) => [CMD.SN_WRITE, [1, slot & 0x7F, ...wr7(off, 3), ...wr7(crc32(bytes), 5), ...pack7(bytes)]],
  snCommit: (slot) => [CMD.SN_WRITE, [2, slot & 0x7F]],
  snAbort: (slot) => [CMD.SN_WRITE, [3, slot & 0x7F]],
};

/* which reply belongs to which request (the device echoes these) */
function replyMatches(cmd, args, a) {
  switch (cmd) {
    case CMD.GET: case CMD.SET: case CMD.DESC: return a[0] === args[0] && a[1] === args[1];
    case CMD.STEP_GET: case CMD.STEP_SET: case CMD.NAMES:
    case CMD.SMP_BEGIN: case CMD.SMP_END: case CMD.SMP_ERASE: return a[0] === args[0];
    case CMD.SMP_WRITE: return a[0] === args[0] && a[1] === args[1] && a[2] === args[2] && a[3] === args[3];
    case CMD.PROJECT: return a[0] === args[0] && a[1] === args[1];
    case CMD.UP_LIST: case CMD.UP_GET: case CMD.UP_PUT: case CMD.UP_STORE: case CMD.UP_LOAD: case CMD.UP_ERASE:
    case CMD.TRACK_MIX: case CMD.TRACK_DUMP: case CMD.DRUM_STEP: case CMD.DRUM_SRCS: case CMD.DRUM_SHOW: case CMD.PAGES: return a[0] === args[0];
    case CMD.WATCH: return (a[0] & 1) === (args[0] & 1);   /* bit 1: v4 firmware only */
    case CMD.TRACK_STEP: case CMD.TRACK_PARAM: return a[0] === args[0] && a[1] === args[1];
    case CMD.SN_OP: case CMD.SN_WRITE: return a[0] === args[0] && a[1] === args[1];
    case CMD.SN_READ: return a[0] === args[0] && a[1] === args[1] && a[2] === args[2] && a[3] === args[3];
    default: return true;
  }
}

/* strict request/response: one frame in flight, the rest queued. Push frames (CHANGED, RELOAD,
   STEP_CHANGED) can come at any time, also between a request and its reply: they go to onPush. */
class Link {
  constructor(send, opts = {}) {
    this.sendRaw = send;
    this.q = [];
    this.cur = null;
    this.closed = false;
    this.lastSent = 0;                              /* Date.now() of the last frame sent (WATCH keep-alive) */
    this.timeout = opts.timeout || 300;
    this.onUnknown = opts.onUnknown || (() => {});
    this.onTimeout = opts.onTimeout || (() => {});
    this.onPush = opts.onPush || (() => {});
    this.onGap = opts.onGap || (() => {});         /* (ms) nothing was sent for that long (WATCH may have ended) */
  }
  get idle() { return !this.cur && !this.q.length; }
  hasQueued(key) { return this.q.some((r) => r.key === key); }
  /* FM6 bank / DX7 import: ported from Melodee (Kerem Kilic, github.com/keremimo/melodee), GPL-3.0-only.
     Yamaha SysEx through the queue (fm6_store.c): send (null: nothing), then after `settle` ms the dump
     request; done when check(reply) returns a value. Editor traffic waits meanwhile: the device holds one
     Yamaha frame at a time and drops one arriving too soon, and a bank's flash write takes a while (a retry
     sends both again, with twice the settle time). fail: the error message, or a function giving it */
  yamaha(send, request, check, fail, opt = {}) {
    if (this.closed) return Promise.reject(new Error("closed"));
    return new Promise((res, rej) => {
      this.q.push({ cmd: null, yam: { send, request, check, fail }, res, rej, timeout: opt.timeout ?? 700,
        retries: opt.retries ?? 2, settle: opt.settle ?? 120 });
      this.pump();
    });
  }
  /* a single voice into the FM6 part's buffer, confirmed by its echo */
  transferDX7(message, opt = {}) {
    let voice;
    try {
      voice = dx7Single(message);
      if (!voice) throw new Error("Expected a DX7 single voice");
      voice = dx7ForDevice(voice);
    } catch (e) { return Promise.reject(e); }
    return this.yamaha(dx7Message(voice), [0xF0, 0x43, 0x20, 0, 0xF7], (d) => {
      const v = dx7Single(d);
      return v && v.every((x, i) => x === voice[i]) ? v : undefined;
    }, "DX7 voice was not confirmed by the device. Try Audition again.", opt);
  }
  /* the FM6 user bank: -> its 4096 bytes (32 INIT VOICE when no USR sample slot holds a bank) */
  readFM6Bank(opt = {}) {
    return this.yamaha(null, [0xF0, 0x43, 0x20, 9, 0xF7], fm6Bank.read, "The FM6 voice bank could not be read.",
      { timeout: 1500, retries: 1, ...opt });
  }
  /* the whole FM6 user bank (the device saves it in its own flash area), confirmed by reading it back.
     Older SLOOP builds kept it in a free USR sample slot: with three samples there they store nothing and read
     back the INIT voices (FM6.NO_SLOT) */
  writeFM6Bank(bank, opt = {}) {
    let empty = false;
    return this.yamaha(fm6Bank.message(bank), [0xF0, 0x43, 0x20, 9, 0xF7], (d) => {
      const b = fm6Bank.read(d);
      if (b) empty = fm6Bank.isEmpty(b) && !fm6Bank.isEmpty(bank);
      return b && b.every((v, i) => v === bank[i]) ? b : undefined;
    }, () => (empty ? FM6.NO_SLOT : "The FM6 voice bank was not confirmed by the device."), { timeout: 1500, settle: 400, ...opt });
  }
  /* r = [cmd, args]; opt: {timeout, retries, key (coalesce queued requests: the latest args win), front,
     quiet (a timeout is expected: no onTimeout)} */
  request(r, opt = {}) {
    if (this.closed) return Promise.reject(new Error("closed"));
    const [cmd, args] = r;
    if (opt.key) {
      const old = this.q.find((x) => x.key === opt.key);
      if (old) { old.cmd = cmd; old.args = args; return old.promise; }
    }
    let res, rej;
    const promise = new Promise((a, b) => { res = a; rej = b; });
    const item = { cmd, args, key: opt.key, res, rej, promise, quiet: !!opt.quiet,
      timeout: opt.timeout || this.timeout, retries: opt.retries ?? 1 };
    if (opt.front) this.q.unshift(item); else this.q.push(item);
    this.pump();
    return promise;
  }
  pump() {
    if (this.cur || this.closed || !this.q.length) return;
    this.cur = this.q.shift();
    this.fire();
  }
  fire() {
    const c = this.cur;
    const now = Date.now(), y = c.yam, settle = y && y.send ? c.settle : 0;
    if (!y) {                                       /* (Yamaha frames do not keep the device's WATCH alive) */
      if (this.lastSent && now - this.lastSent > 2500) this.onGap(now - this.lastSent);
      this.lastSent = now;
    }
    try {
      this.sendRaw(y ? y.send || y.request : frame(c.cmd, c.args));
      if (settle) c.readTimer = setTimeout(() => {
        if (this.cur !== c) return;
        try { this.sendRaw(y.request); } catch (e) { this.finish(null, e); }
      }, settle);
    } catch (e) { this.finish(null, e); return; }
    c.timer = setTimeout(() => {
      if (this.cur !== c) return;
      if (c.retries-- > 0) { if (settle) c.settle *= 2; this.fire(); return; }
      if (!c.quiet && !y) this.onTimeout(c.cmd);
      this.finish(null, new Error(!y ? "timeout (cmd " + c.cmd + ")" : typeof y.fail === "function" ? y.fail() : y.fail));
    }, c.timeout + settle);
  }
  finish(val, err) {
    const c = this.cur;
    if (!c) return;
    clearTimeout(c.timer);
    clearTimeout(c.readTimer);
    this.cur = null;
    if (err) c.rej(err); else c.res(val);
    this.pump();
  }
  /* raw incoming MIDI bytes */
  receive(data) {
    const pending = this.cur;
    if (pending && pending.yam && data[0] === 0xF0 && data[1] === 0x43) {
      let v;
      try { v = pending.yam.check(data); } catch (e) { /* corrupt or unrelated Yamaha frame: wait for a valid readback */ }
      if (v !== undefined) this.finish(v);
      return;
    }
    const f = unframe(data);
    if (!f) return;                                  /* not ours (notes, clock, other SysEx) */
    if (PUSH.has(f.cmd)) { this.onPush(f); return; }
    const c = this.cur;
    if (!c || f.cmd !== c.cmd || !replyMatches(c.cmd, c.args, f.a)) { this.onUnknown(f); return; }
    this.finish(f.a);
  }
  close() {
    this.closed = true;
    const all = (this.cur ? [this.cur] : []).concat(this.q);
    if (this.cur) clearTimeout(this.cur.timer);
    if (this.cur) clearTimeout(this.cur.readTimer);
    this.cur = null;
    this.q = [];
    for (const r of all) r.rej(new Error("closed"));
  }
}

/* ------------------------------------------------------------- formatting --- */
const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const noteName = (n) => NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);   /* 60 = C4 */
/* GM drum notes (35..81) by short names, for the drum track's steps */
const GM_DRUM = { 35: "KICK2", 36: "KICK", 37: "RIM", 38: "SNARE", 39: "CLAP", 40: "SNARE2", 41: "LTOM2", 42: "CHH", 43: "LTOM",
  44: "PHH", 45: "MTOM2", 46: "OHH", 47: "MTOM", 48: "HTOM2", 49: "CRASH", 50: "HTOM", 51: "RIDE", 52: "CHINA", 53: "BELL",
  54: "TAMB", 55: "SPLASH", 56: "COWBELL", 57: "CRASH2", 58: "VIBRA", 59: "RIDE2", 60: "HBONGO", 61: "LBONGO", 62: "MCONGA",
  63: "HCONGA", 64: "LCONGA", 65: "HTIMB", 66: "LTIMB", 67: "HAGOGO", 68: "LAGOGO", 69: "CABASA", 70: "MARACA", 71: "SWHIS",
  72: "LWHIS", 73: "SGUIRO", 74: "LGUIRO", 75: "CLAVES", 76: "HWOOD", 77: "LWOOD", 78: "MCUICA", 79: "OCUICA", 80: "MTRI", 81: "OTRI" };
const GM_DRUM_BY_NAME = Object.fromEntries(Object.entries(GM_DRUM).map(([n, s]) => [s, +n]));
const drumName = (n) => GM_DRUM[n] || String(n);
/* a note token: a number, a note name (C4, F#3, Bb2) or a GM drum name (KICK, CHH) */
function parseNote(tok) {
  const dn = GM_DRUM_BY_NAME[tok.toUpperCase()];
  if (dn != null) return dn;
  if (/^\d+$/.test(tok)) { const n = +tok; return n <= 127 ? n : null; }
  const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(tok);
  if (!m) return null;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1].toUpperCase()];
  const n = base + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  return n >= 0 && n <= 127 ? n : null;
}
/* "C4 E4 G4" -> [60, 64, 67]; null on a bad token or more than 4 notes */
function parseNotes(s) {
  const t = s.trim().split(/[\s,]+/).filter(Boolean);
  if (t.length > 4) return null;
  const out = t.map(parseNote);
  return out.includes(null) ? null : out;
}

/* close to the device's param_format (params.c), tables from tools/gen_tables.py */
function fmtValue(d, v) {
  const sign = (x) => (x > 0 ? "+" + x : String(x));
  switch (d.fmt) {
    case F.PCT: return [String(d.max > 0 ? Math.trunc((v * 100 + Math.trunc(d.max / 2)) / d.max) : v), "%"];
    case F.SWING: return [String(50 + Math.trunc((Math.max(0, Math.min(100, v)) + 2) / 4)), "%"];   /* MPC: 50 % straight .. 75 % */
    case F.FILT: return !v ? ["OFF", ""] : v < 0 ? ["LP" + Math.trunc((-v * 100 + 32) / 64), "%"] : ["HP" + Math.trunc((v * 100 + 31) / 63), "%"];
    case F.BIPCT: return [sign(Math.trunc(v * 100 / 64)), "%"];
    case F.TIME: {
      if (d.label === "REL2" && !v) return ["=DEC", ""];   /* ANALOG 2 ENV2: the release takes DEC2's time */
      const ms10 = Math.round(10 * Math.pow(10000, (v & 127) / 127));
      if (ms10 < 100) return [(ms10 / 10).toFixed(1), "ms"];
      if (ms10 < 10000) return [String(Math.round(ms10 / 10)), "ms"];
      return [(ms10 / 10000).toFixed(2), "s"];
    }
    case F.LFOHZ: { const h = 0.05 * Math.pow(800, (v & 127) / 127); return [h < 10 ? h.toFixed(2) : h.toFixed(1), "Hz"]; }
    case F.CUTOFF: { const h = 30 * Math.pow(16000 / 30, (v & 127) / 127); return h < 1000 ? [String(Math.round(h)), "Hz"] : [(h / 1000).toFixed(1), "kHz"]; }
    case F.DB: return v <= 0 ? ["OFF", ""] : [((v - 112) / 2).toFixed(1), "dB"];
    case F.SEMI: return [sign(v), "st"];
    case F.ENUM: { const n = d.names[v - d.min]; return [n === "" ? "(not in this build)" : n ?? String(v), d.unit || ""]; }
    case F.BPM: return [String(v), "BPM"];
    case F.NOTE: return [NOTE_NAMES[((v % 12) + 12) % 12], ""];
    case F.ONOFF: return [v ? "ON" : "OFF", ""];
    case F.STEPS: return [String(v), "STEP"];
    default: return [String(v), d.unit || ""];
  }
}

/* ---------------------------------------------------------- user samples --- */
/* A port of tools/sampleio.py (read_any_wav, resample, to_int16, ima_encode, user_slot),
   byte for byte: web/test_web.mjs compares them. */
const SMP = { SLOT_SIZE: 0x14000, DATA_OFF: 512, RATE: 22050, HDR_LEN: 32 + 16 * 28, MAX_ZONES: 16 };
SMP.MAX_DATA = SMP.SLOT_SIZE - SMP.DATA_OFF;

/* groups of up to 7 bytes, each preceded by their top bits */
function pack7(b) {
  const out = [];
  for (let i = 0; i < b.length; i += 7) {
    const g = Array.from(b.slice(i, i + 7));
    out.push(g.reduce((m, x, j) => m | (((x >> 7) & 1) << j), 0));
    for (const x of g) out.push(x & 0x7F);
  }
  return out;
}
function unpack7(a) {
  const out = [];
  for (let i = 0; i < a.length; i += 8) {
    const top = a[i];
    for (let j = 0; j < 7 && i + 1 + j < a.length; j++) out.push(a[i + 1 + j] | (((top >> j) & 1) << 7));
  }
  return Uint8Array.from(out);
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

const IMA_STEP = [7, 8, 9, 10, 11, 12, 13, 14, 16, 17, 19, 21, 23, 25, 28, 31, 34, 37, 41, 45, 50, 55, 60, 66, 73, 80, 88,
  97, 107, 118, 130, 143, 157, 173, 190, 209, 230, 253, 279, 307, 337, 371, 408, 449, 494, 544, 598, 658,
  724, 796, 876, 963, 1060, 1166, 1282, 1411, 1552, 1707, 1878, 2066, 2272, 2499, 2749, 3024, 3327, 3660,
  4026, 4428, 4871, 5358, 5894, 6484, 7132, 7845, 8630, 9493, 10442, 11487, 12635, 13899, 15289, 16818,
  18500, 20350, 22385, 24623, 27086, 29794, 32767];
const IMA_IDX = [-1, -1, -1, -1, 2, 4, 6, 8];
/* IMA ADPCM, 4 bit, low nibble first, from predictor 0 / index 0 -> {data, pred, idx} (state at loopStart) */
function imaEncode(s, loopStart = 0) {
  let pred = 0, idx = 0, atLoop = [0, 0];
  const nib = new Uint8Array(s.length + (s.length & 1));
  for (let n = 0; n < s.length; n++) {
    if (n === loopStart) atLoop = [pred, idx];
    const step = IMA_STEP[idx];
    let diff = s[n] - pred, code = 0;
    if (diff < 0) { code = 8; diff = -diff; }
    let vd = step >> 3;
    if (diff >= step) { code |= 4; diff -= step; vd += step; }
    if (diff >= step >> 1) { code |= 2; diff -= step >> 1; vd += step >> 1; }
    if (diff >= step >> 2) { code |= 1; vd += step >> 2; }
    pred = Math.max(-32768, Math.min(32767, code & 8 ? pred - vd : pred + vd));
    idx = Math.max(0, Math.min(88, idx + IMA_IDX[code & 7]));
    nib[n] = code;
  }
  const out = new Uint8Array(nib.length >> 1);
  for (let k = 0; k < nib.length; k += 2) out[k >> 1] = nib[k] | (nib[k + 1] << 4);
  return { data: out, pred: atLoop[0], idx: atLoop[1] };
}

/* WAV: PCM 8/16/24/32 or float, any channel count, mixed to mono -> {sr, x} (gen_samples.read_any_wav) */
function parseWav(buf) {
  const d = new Uint8Array(buf), v = new DataView(d.buffer, d.byteOffset, d.byteLength);
  const id = (i) => String.fromCharCode(d[i], d[i + 1], d[i + 2], d[i + 3]);
  if (d.length < 12 || id(0) !== "RIFF" || id(8) !== "WAVE") throw new Error("not a WAV file");
  let i = 12, fmt = null, data = null;
  while (i + 8 <= d.length) {
    const cid = id(i), n = v.getUint32(i + 4, true);
    if (cid === "fmt ") {
      let tag = v.getUint16(i + 8, true);
      const ch = v.getUint16(i + 10, true), sr = v.getUint32(i + 12, true), bits = v.getUint16(i + 22, true);
      if (tag === 0xFFFE) tag = v.getUint16(i + 32, true);
      fmt = { tag, ch, sr, bits };
    } else if (cid === "data") {
      data = [i + 8, Math.min(d.length, i + 8 + n)];
      break;
    }
    i += 8 + n + (n & 1);
  }
  if (!fmt || !data) throw new Error("WAV without fmt/data");
  const { tag, ch, sr, bits } = fmt, bps = bits >> 3, frame = bps * ch;
  if (!(tag === 1 || tag === 3) || !bps || !ch) throw new Error("unsupported WAV format");
  const nfr = Math.floor((data[1] - data[0]) / frame), x = new Float64Array(nfr);

/* Chopping a recording into a slot (the CHOP block of the samples tab). All at SMP.RATE, positions

const CHOP = { HOP: 128, MAX: 16, FADE_IN: 22, FADE_OUT: 132, PRE: 32 };   /* 5.8 ms frames; fades 1 / 6 ms; start 1.5 ms early */

/* onset novelty per frame: the rise of the log energy of the signal's first difference (the attack
   of a hit, not its body), over the louder of the two frames before */
function chopNovelty(x) {
  const H = CHOP.HOP, F = Math.ceil(x.length / H), L = new Float64Array(F), P = new Float64Array(F), nov = new Float64Array(F);
  let top = 1e-12, ptop = 1e-12;
  for (let f = 0; f < F; f++) {
    let e = 0, p = 0;
    for (let i = f * H, n = Math.min(x.length, i + H); i < n; i++) { const d = x[i] - (i ? x[i - 1] : 0); e += d * d; p += x[i] * x[i]; }
    L[f] = e;
    P[f] = p;
    if (e > top) top = e;
    if (p > ptop) ptop = p;
  }
  for (let f = 0; f < F; f++) { L[f] = Math.log10(L[f] / top + 1e-9); P[f] = Math.log10(P[f] / ptop + 1e-9); }   /* 0 = the loudest */
  for (let f = 0; f < F; f++) {
    const before = Math.max(f ? L[f - 1] : -9, f > 1 ? L[f - 2] : -9);
    nov[f] = L[f] > -3.5 ? Math.max(0, L[f] - before) : 0;              /* (under -35 dB: no hit) */
  }

  return nov;
}

/* the first sample of the hit in frame f: where the signal first reaches 30 % of its peak over the
   frames f-1..f+2, then PRE samples earlier (the attack is kept whole) */
function chopAttack(x, f) {

  let pk = 0;

  return a;

/* hits: sens 1 (only the hardest and loudest) .. 10 (every small one); at least 60 ms apart. A hit is a
   sharp rise (nov over thr) to a level (its loudest frame within 3) over the gate */
function chopHits(x, nov, sens) {
  const k = Math.max(1, Math.min(10, sens)), thr = 0.15 + (10 - k) * 0.08, gate = -(0.5 + k * 0.35);
  const gap = Math.round(0.06 * SMP.RATE / CHOP.HOP), L = nov.level;
  const out = [];
  let last = -1e9;
  for (let f = 0; f < nov.length - 1; f++) {        /* (a hit on the very first frame counts too) */
    if (nov[f] < thr || (f && nov[f] < nov[f - 1]) || nov[f] < nov[f + 1]) continue;
    if (L && Math.max(L[f], L[Math.min(L.length - 1, f + 1)], L[Math.min(L.length - 1, f + 2)]) < gate) continue;
    if (f - last < gap) {
      if (out.length && nov[f] > nov[last]) { out[out.length - 1] = chopAttack(x, f); last = f; }
      continue;
    }
    out.push(chopAttack(x, f));

/* a tap at pos (as heard) moved to the hit it meant: the strongest attack within +-win s, if any */
function chopSnap(x, nov, pos, win = 0.05) {
  const H = CHOP.HOP, w = Math.round(win * SMP.RATE / H), c = Math.round(pos / H);
  let best = -1, bv = 0.12;
  for (let f = Math.max(1, c - w); f <= Math.min(nov.length - 1, c + w); f++) if (nov[f] > bv) { bv = nov[f]; best = f; }
  return best < 0 ? Math.max(0, Math.min(x.length - 1, Math.round(pos))) : chopAttack(x, best);

/* markers every `beats` beats at bpm from start to end */
function chopGrid(start, end, bpm, beats) {

function chopEqual(start, end, n) {

   the chops of sorted markers: each to the next marker (the last to the end), cut at maxLen samples
   when maxLen > 0 -> [{start, end, i, off, full}] (all of them; the slot takes CHOP.MAX).

/* the chops the slot gets: mode 0 the kept ones, the first CHOP.MAX of them; mode 1 the chop `sel` */

/* -------------------------------------------------------------- librarian --- */
/* A patch (library entry, user preset):
     {name, engine (index), engineName, p: [P_COUNT values by parameter id, null = unknown],
      pattern: 16 x [note 0..127 (0 rest), flags 1 accent | 2 slide | 4 tie] or null, tags: [], created, modified,
      dx7?: [155 seven-bit VCED bytes] (an FM6 voice imported from a DX7 .syx; also kept in JSON exports)}

     {
       "format": "felucca-library", "version": 1,
       "kind": "library" | "bank" | "patch",
       "firmware": "FELUCCA 0.5 ...",          device version string when exported ("" if unknown)
       "pCount": 57, "pE0": 49,                 P_COUNT and the first engine parameter id
       "paramLabels": ["LVL", "ATK", ...],      one key per parameter id: the DESC label, "#2", "#3" appended to
                                                a repeated label (PIT, PIT#2), and "E0".."E7" for the engine
                                                parameters (their labels depend on the engine)
       "engines": ["ANALOG", ...],              engine names by index
       "exported": "2026-10-03T12:00:00.000Z",
       "patches": [{ "name", "engine", "engineName", "params": [pCount numbers or null],

                     "slot": n (bank files only, 0-based), "dx7": [155 numbers] (DX7 voices only) }]
     }

   the right values; parameters the file does not have are null (left at the engine default). Engines are

     count is not checked (some tools write 09 10 00); the payload is taken right after the 6-byte header whatever

     >= 0x80 inside it) keeps its whole voices (a name cut short ends in blanks); raw data is masked to 7 bits;
   - several messages in one file, junk before / between / after them;
   - the format's other blocks (43h: supplements, performances, 4-operator voices, universal "LM  ..." blocks) and
     other makers' messages are skipped and counted;
   - raw data without SysEx: 4096 x n bytes (banks), 155 (one voice) or 128 bytes (one packed voice).
   -> {voices: [155-byte VCED arrays], banks: [4096-byte packed banks: the complete 32-voice ones], badSum: messages
       with a wrong checksum (still read), short: messages cut short, skipped: other messages, kinds: what the
       skipped ones were ("fm4" 4-operator voices, "other43" the format's other blocks, "universal", "maker:XX"),
       sysex: an F0 was seen} */

  if (d.length !== 163 || d[0] !== 0xF0 || d[1] !== 0x43 || d[2] > 15 || d[3] !== 0 || d[4] !== 1 || d[5] !== 0x1B) return undefined;
  const v = Array.from(d.slice(6, 161));

      : r.kinds.includes("other43") ? "DX7 performances or supplements only, no voice"
      : mk ? `another maker's SysEx (ID ${mk.slice(6)})` : r.kinds.includes("universal") ? "universal SysEx only, no voice"

/* parameter keys by id from the instrument DESCs */

    const l = (pdesc[i] && pdesc[i].label) || "P" + i;

const A2_AMT_KEYS = ["FLT#3", "PIT#3", "SHP#3", "OSC2", "ENV2"];

   (69 / 61) are ATK2 DEC2; FENV (69 / 61) is FLT's amount; AMT2 with DST2 (72 / 64) goes to that destination's

  const val = (k) => (at.has(k) ? p[at.get(k)] ?? null : null);

    if (val("FATK") != null) put("ATK2", val("FATK"));
    if (val("FDEC") != null) put("DEC2", val("FDEC"));
    const amt = val("AMT2") ?? val("FENV");
    if (amt != null) {
      const d = Math.max(0, Math.min(4, val("DST2") ?? 0));
      A2_AMT_KEYS.forEach((k, i) => put(k, i === d ? amt : 0));

}

/* one pattern step as the firmware keeps it (up_pat_norm): a tie has no note, a rest no flags */

    ? Array.from({ length: UP.PAT }, (_, i) => { const x = pt.pattern[i]; return Array.isArray(x) ? patNorm(x[0] | 0, x[1] | 0) : [0, 0]; })
    : null;

    name: String(pt.name ?? "PATCH").slice(0, 32) || "PATCH",
    engine: pt.engine | 0, engineName: String(pt.engineName ?? ""),
    p: Array.from(pt.p || pt.params || [], (v) => (Number.isFinite(v) ? Math.round(v) : null)),
    pattern: patternUsed(pat) ? pat : null,
    tags: Array.isArray(pt.tags) ? [...new Set(pt.tags.map((x) => String(x).trim()).filter(Boolean))] : [],
    created: pt.created || now, modified: pt.modified || pt.created || now,

  if (pt.dx7 != null) { o.dx7 = dx7Voice(pt.dx7); o.engineName = "FM6"; }

    pCount: ctx.keys ? ctx.keys.length : 0, pE0: ctx.pe0 ?? null, paramLabels: ctx.keys || [], engines: ctx.engines || [],
    exported: new Date().toISOString(),

      const o = { name: c.name, engine: c.engine, engineName: c.engineName || (ctx.engines || [])[c.engine] || "",

function readLibraryFile(obj, ctx) {

  const engIndex = (name, idx, fileEngines) => {
    const nm = name || (fileEngines || [])[idx];
    if (ctx.engines && ctx.engines.length) {
      if (nm) return ctx.engines.indexOf(nm);
      return idx < ctx.engines.length ? idx : -1;
    }
    return idx;
  };
  if (obj.format === "felucca-patch") {               /* "Save to file": the whole current sound */
    if (!Array.isArray(obj.p) || !Number.isInteger(obj.engine)) throw new Error("felucca-patch without engine / p");
    const e = engIndex(obj.engineName, obj.engine);
    if (e < 0) return { patches: [], skipped: 1, keys: null };
    return { patches: [cleanPatch({ name: obj.presetName || obj.engineName || "PATCH", engine: e, engineName: obj.engineName,
      p: obj.p.slice(0, ctx.keys ? ctx.keys.length : obj.p.length), pattern: Array.isArray(obj.steps) ? patternFromSteps(obj.steps) : null, tags: ["file"] })],
      skipped: 0, keys: null };

  if (!(obj.version >= 1)) throw new Error("version");
  if (!Array.isArray(obj.patches)) throw new Error("no patches");
  const fileKeys = Array.isArray(obj.paramLabels) && obj.paramLabels.length ? obj.paramLabels.map(String) : null;
  const out = [];

  for (const x of obj.patches) {

    const e = engIndex(x.dx7 != null ? "FM6" : x.engineName, x.engine | 0, obj.engines);
    if (e < 0 && x.dx7 == null) { skipped++; continue; }   /* (a DX7 voice is kept: it needs no engine to be stored) */
    const p = remapParams(x.params, fileKeys, ctx.keys);

/* device side; rq(r, opt) -> reply args (Link.request), info from INFO */
const FLASH_OPT = { timeout: 2500, retries: 0 };

  async list(rq) {
    const first = parse[CMD.UP_LIST](await rq(req.upList(0, UP.LIST_MAX)));
    const slots = first.slots.slice();
    while (slots.length < first.total) {
      const r = parse[CMD.UP_LIST](await rq(req.upList(slots.length, Math.min(UP.LIST_MAX, first.total - slots.length))));
      if (!r.count) break;

  async get(rq, info, slot) { return parse[CMD.UP_GET](await rq(req.upGet(slot)), info); },
  /* -> rc (0 ok) */
  async put(rq, slot, pt) {
    if (pt.dx7) throw new Error("DX7 voices go to the FM6 bank, not to a user preset slot");
    return parse[CMD.UP_PUT](await rq(req.upPut(slot, pt), FLASH_OPT)).rc;
  },
  async store(rq, slot, name) { return parse[CMD.UP_STORE](await rq(req.upStore(slot, name), FLASH_OPT)).rc; },
  async load(rq, slot) { return parse[CMD.UP_LOAD](await rq(req.upLoad(slot), { timeout: 1000 })).rc; },
  async erase(rq, slot) { return parse[CMD.UP_ERASE](await rq(req.upErase(slot), FLASH_OPT)).rc; },

/* the current sound: DUMP + the first 16 steps */
async function capturePatch(rq, info, name) {
  const dump = parse[CMD.DUMP](await rq(req.dump()), info);
  const steps = [];
  for (let i = 0; i < UP.PAT && i < info.nstep; i++) steps.push(parse[CMD.STEP_GET](await rq(req.stepGet(i))));
  return { patch: cleanPatch({ name, engine: dump.engine, engineName: info.engines[dump.engine], p: dump.p, pattern: patternFromSteps(steps) }), dump, steps };
}

/* what loading a sound leaves alone (firmware ui.c param_kept): the mix (LEVEL, PAN, MUTE), the pattern
   parameters (LEN, DIV, SWG, GATE) and the key the part plays in (ROOT, SCL, QNT; CHORD from SLOOP 2.0) */
