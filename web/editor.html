/* play a patch without writing flash, as UP_LOAD would load it: SET the engine (G_ENGSEL, engine defaults),
   then every parameter of the sound that differs. Never the pattern (LIVE: a sound never changes the
   sequence), the mix or the key. opt: {gEng: G_ENGSEL id, progress(i, n),
   sendDX7(message): a DX7 voice (pt.dx7) goes to the FM6 part after the engine is set} -> {wrote: false} */
async function auditionPatch(rq, info, pt, opt = {}) {
  const voice = pt.dx7 ? dx7Message(pt.dx7) : null;
  const engine = voice ? info.engines.indexOf("FM6") : pt.engine;
  if (voice && (engine < 0 || !opt.sendDX7)) throw new Error("FM6 voice transfer unavailable");
  if (voice && parse[CMD.DUMP](await rq(req.dump()), info).engine >= info.nengines)
    throw new Error("Select a synth track to audition a DX7 voice");
  await rq(req.set(1, opt.gEng ?? 20, engine));
  const dump = parse[CMD.DUMP](await rq(req.dump()), info);
  const n = Math.min(info.pcount, pt.p.length), kept = keptIds(info);
  for (let i = 0; i < n; i++) {
    const v = pt.p[i];
    if (opt.progress) opt.progress(i, n);
    if (v == null || kept.has(i) || v === dump.p[i]) continue;
    await rq(req.set(0, i, v));
  }
  if (voice) await opt.sendDX7(voice);
  return { wrote: false };

/* WATCH on, asking for everything (TRACK_CHANGED, v9's pushes and stream): false when the firmware does not know it (older
   than protocol v2), else the bits it granted: 1, 3 with TRACK_PARAM / TRACK_CHANGED (v4), 15 with v9 (every track's
   changes pushed, the status stream: no polling). ask: the bits to ask for (15) */
async function startWatch(rq, ask = WATCH.ALL) {
  try { const on = parse[CMD.WATCH](await rq(req.watch(ask), { timeout: 300, retries: 1, quiet: true })).on; return on & 1 ? on & WATCH.ALL : false; }
  catch (e) { if (e.message === "closed") throw e; return false; }
}
/* what a WATCH reply means: {watch, v4, v9, stream} */
const watchCaps = (on) => ({ watch: on || false, v4: !!(on & WATCH.V4), v9: !!(on & WATCH.V9), stream: !!(on & WATCH.STREAM) });

/* ------------------------------------------------------------ meters (v9) --- */
/* The device sends each meter's largest peak since its last STREAM frame (no peak is lost between two frames, at 25 Hz
   at most and only while something changes); the editor draws the ballistics, so the device keeps no meter state and
   the look is the editor's to choose: an instant rise, a fall of METER.FALL dB/s, a peak hold line for METER.HOLD ms
   that then falls too. Scale: the peak 8192 = 0 dBFS (a track: before the master volume; the master: the output) */
const METER = { MIN: -60, MAX: 6, FALL: 24, HOLD: 1500, WARN: -6, CLIP: -0.5 };

/* one meter, dt ms later, with in (dB, -Infinity: no new peak) arrived: {db, hold, holdAt} at now (ms) */
function meterStep(m, inDb, dt, now) {
  const fall = (METER.FALL * dt) / 1000;
  const db = Math.max(METER.MIN, Math.max(Number.isFinite(inDb) ? inDb : -Infinity, m.db - fall));
  let hold = m.hold, holdAt = m.holdAt;
  if (db >= hold) { hold = db; holdAt = now; }
  else if (now - holdAt > METER.HOLD) hold = Math.max(db, hold - fall);

}

const meterState = (db) => (db >= METER.CLIP ? "err" : db > METER.WARN ? "warn" : "ok");
const meterFrac = (db) => Math.max(0, Math.min(1, (db - METER.MIN) / (METER.MAX - METER.MIN)));

/* ------------------------------------------------------------ mixer (v3) --- */
/* The TRACKS page in the editor: TRACK (engine, preset, level, mute, armed of all four) and TRACK_DUMP
   of each track for its P_PAN. Level and mute go through TRACK_MIX (any track; the drum level is
   G_DRLVL). Pan: TRACK_PARAM (v4, any track); with v3 firmware a plain SET, which reaches only the
   selected track: another track is selected for it and the selection is put back (TRACK pushes no
   RELOAD). ids: {pan: P_PAN id} */
const mixer = {
  async read(rq, info, ids) {
    const tr = parse[CMD.TRACK](await rq(req.track()));
    for (let i = 0; i < tr.ntrk; i++) {
      const d = parse[CMD.TRACK_DUMP](await rq(req.trackDump(i)), info);
      tr.tracks[i].pan = ids.pan == null ? null : d.p[ids.pan];
      tr.tracks[i].e0 = d.p[info.pe0];               /* the drum track: its kit */
      tr.tracks[i].fx = ids.fx ? ids.fx.map((id) => d.p[id]) : null;   /* DIST CHO DLY REV (the FX page) */
      tr.tracks[i].fxoff = ids.fxoff == null ? null : d.p[ids.fxoff] ? 1 : 0;

  async setParam(rq, track, sel, id, v, v4, key) {

    return mixer.setPan(rq, track, sel, id, v, false);

  /* -> {track, level, mute} as the device has them now */
  async setMix(rq, track, level, mute, opt) { return parse[CMD.TRACK_MIX](await rq(req.trackMix(track, level, mute), opt)); },
  /* -> the pan value after clamping. v4: TRACK_PARAM, the selection stays */

    if (v4) return parse[CMD.TRACK_PARAM](await rq(req.trackParam(track, panId, v), { key: "pan:" + track })).value;
    if (track === sel) return parse[CMD.SET](await rq(req.set(0, panId, v))).value;
    await rq(req.track(track));
    try { return parse[CMD.SET](await rq(req.set(0, panId, v))).value; }
    finally { await rq(req.track(sel)).catch(() => {}); }
  },
};

  ["house", ["HOUSE", "D.HOUSE", "TECHNO", "MINIMAL", "ELECTRO", "DISCO", "GARAGE"]], ["bass", ["JUNGLE", "DUBSTEP"]],
  ["world", ["DEMBOW", "AMAPIANO", "AFRO", "LATIN", "TRIBAL"]], ["retro", ["SYNTHWV", "CHIP", "ARCADE", "GLITCH"]],

    ...kitNames.map((n, k) => ({ src: DL.KIT0 + k, kind: kind(n, k), built: true, name: n })),

/* ---------------------------------------------------------- piano roll (model) --- */
/* The synth part's steps as a piano roll, mapped exactly to the firmware's step (core.h step_t, 10 bytes: note[4], n,

  time: s ? s.time | 0 : ROLL.REST, flags: s ? s.flags & 3 : 0, vel: s ? s.vel | 0 : 0, lvl: s ? s.lvl | 0 : 0, rat: s ? s.rat | 0 : 0 });

/* The mixer is home. Library, samples, projects and settings are full screens (the transport bar); every track editor
   is a popup one click from its strip (NAV): Sound, Sequence, Load / Save preset, a drum lane, the kit,
   the kit store, the master. One at a time; x, Escape or a click outside closes it, back to the mixer as it was. The
   last screen is remembered (localStorage) and in the URL hash; the old tab names open their popup (#sound, #drums) */
const TABS = SCREENS;
const TAB_KEY = "felucca-editor-tab";
const OLD_TABS = { sound: "sound", sequencer: "sequence", drums: "lane", tracks: null };
let pendingPop = null;                           /* an old #tab: its popup, once connected */
let tab = (() => {
  const h = location.hash.slice(1);
  if (h === "backup") return "projects";            /* (the installer's "back up first?") */
  if (h in OLD_TABS) { pendingPop = OLD_TABS[h]; return "mixer"; }
  if (TABS.includes(h)) return h;
  try { const v = localStorage.getItem(TAB_KEY); if (TABS.includes(v)) return v; } catch (e) { /* no storage */ }
  return "mixer";
})();
let nav = { screen: tab, pop: null };
const hasTracks = () => !!dev && !!dev.info && !!dev.info.ntrk;
function showTab(name) {
  if (name in OLD_TABS) { const p = OLD_TABS[name]; name = "mixer"; if (p && dev && dev.dump) setTimeout(() => openPop(p, p === "lane" ? drumIndex() : dev.sel, kl.sel), 0); }
  if (!TABS.includes(name)) name = "mixer";
  closePop();
  const prev = tab;
  tab = name;
  nav = navScreen(nav, name);
  try { localStorage.setItem(TAB_KEY, name); } catch (e) { /* no storage */ }
  if (location.hash !== "#" + name) history.replaceState(null, "", location.pathname + location.search + "#" + name);
  renderPanels();
  if (name === "mixer" && prev !== "mixer" && hasTracks() && dev.dump) op(readMixer);
}
const drumIndex = () => (dev && dev.mix ? dev.mix.ntrk - 1 : 3);
/* the popup: its panel moved into the dialog (and home again when it closes) */
const POP_PANEL = { sound: "p-sound", sequence: "p-sequencer", lane: "p-drums", kitstore: "p-kitstore" };
let popPanel = null;
const POP_TRACK = new Set(["sound", "sequence", "loadpreset", "savepreset"]);   /* (these act on the selected track: selected first) */
async function openPop(id, track = 0, lane = 0) {
  if (!dev || !dev.dump || !NAV[id]) return;
  closePop();
  nav = navOpen(nav, id, track, lane);
  if (tab !== "mixer") { tab = "mixer"; renderPanels(); }
  const dlg = $("pop"), body = $("popbody");
  const p = $(POP_PANEL[id] || "p-dyn");
  popPanel = p;
  body.append(p);
  p.hidden = false;
  dlg.dataset.pop = id;
  $("trackbar").hidden = !(id === "sound" || id === "sequence");
  if (!dlg.open) dlg.showModal();
  $("poptitle").textContent = popTitle(id, track, lane);
  if (POP_TRACK.has(id) && hasTracks() && track !== dev.sel) {
    p.classList.add("loading");
    await new Promise((res) => { selectTrack(track, res); });
    p.classList.remove("loading");
    if (!nav.pop || nav.pop.id !== id) return;
  }
  if (id === "lane") { kl.sel = lane; renderKit(); }
  else if (id === "kitstore") renderKit();
  else if (id === "sequence") renderSteps();
  else if (!POP_PANEL[id]) buildDyn(id, track, p);

  if (nav.pop) {

  const what = x ? trackName(x) : "";
  switch (id) {
    case "sound": return `${tr} · ${what}`;
    case "sequence": return `${t("popSeq")} · ${tr} · ${what}`;
    case "loadpreset": return `${t("popLoad")} · ${tr} · ${what}`;
    case "savepreset": return `${t("popSave")} · ${tr} · ${what}`;
    case "lane": return `${t("drumKit")} · ${laneName(lane & 15)}`;

const hasSnaps = () => !!dev && !!dev.sn;            /* the firmware has snapshots (protocol v8, commands 54..57) */
function renderPanels() {
  const want = tab;
  for (const b of $("tabs").querySelectorAll("button[data-tab]")) {
    if (b.dataset.tab === "snapshots") b.hidden = !hasSnaps();   /* (the Snapshots screen: only with snapshots) */
    const on = b.dataset.tab === want;
    b.setAttribute("aria-selected", on ? "true" : "false");
    b.tabIndex = on ? 0 : -1;
  }
  const ready = !!dev && !!dev.dump;
  document.documentElement.dataset.conn = ready ? "on" : "off";   /* not connected: the connect card only */
  let hint = "";
  for (const p of document.querySelectorAll(".panel[data-tab]")) {
    const mine = p.dataset.tab === want;
    let show = mine && (!("dev" in p.dataset) || ready);
    if (mine && "dev" in p.dataset && !dev) hint = "needDevice";   /* (while connecting the status line says it) */
    if (show && want === "samples" && !dev.smp) { show = false; hint = "smpNone"; }
    if (show && want === "snapshots" && !hasSnaps()) { show = false; hint = "snNone"; }
    p.hidden = !show;
  }
  $("hint").hidden = !hint;
  if (hint) $("hint").textContent = t(hint);

$("tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });

  ...(a2 && pe0 === 67 ? [A2_ENV2] : []),

  { t: "FX", pages: [["FX", 0, [33, 34, 35, 36]], ["SLICER", 0, [45, 46, 47, 48]], ["BYPASS", 0, [50]], ["DLY", 1, [4, 5, 6, 7]], ["REV/CHO", 1, [8, 9, 10, 11]]] },
  { t: "SCL", pages: [["SCL", 0, [25, 26, 27, 49]], ["SCL 2", 0, [28]]] },
  { t: "ARP", pages: [["ARP", 0, [17, 18, 19, 20]], ["ARP 2", 0, [21, 22, 23, 24]]] },
  { t: "SEQ PATTERN", tab: "seqgroups", pages: [["PATTERN", 0, [29, 30, 31, 32]]] },
  { t: "GLOBAL", tab: "setgroups", pages: [["GLOBAL", 1, [0, 1, 2, 3]]] },
  { t: "MASTER", tab: "setgroups", pages: [["MASTER", 1, [27, 28, 29, 30]]] },

/* globals that are actions or placeholders on the device: buttons instead, or hidden; BPM: only in the transport bar */

const key = (s, id) => s + ":" + id;

const pSlen = () => { const i = dev.pdesc.findIndex((d) => d && d.fmt === F.STEPS); return i >= 0 ? i : P.SLEN; };
/* mixer ids by DESC label (core.h: P_PAN 39, P_MUTE 40, G_DRLVL 25) */
const pById = (label, def) => { const i = dev.pdesc.findIndex((d, k) => d && k < dev.info.pe0 && d.label === label); return i >= 0 ? i : def; };
const pPan = () => pById("PAN", 39), pMute = () => pById("MUTE", 40);
/* the FX page (core.h P_DIST P_CHOR P_DLY P_REV 33..36, P_FXOFF 50): the Mix tab's sends */
const FX_LABELS = ["DST", "CHO", "DLY", "REV"];
const pFx = () => FX_LABELS.map((n, j) => pById(n, 33 + j)), pFxoff = () => pById("FX", P.FXOFF);

const isDrum = () => !!dev && !!dev.dump && dev.dump.engine >= dev.info.nengines;

/* -------------------------------------------------------------- MIDI --- */
/* connect: on page load (auto), with the Connect button, and again whenever an FM-1 is plugged in (statechange) */
async function connect() {
  wantConnected = true;
  if (dev) return;
  $("connect").disabled = true;
  sayK("connecting");
  try {
    if (!access) {
      if (MOCK) { mock = makeMockDevice({ legacy: QS.get("legacy") === "1", auto: QS.get("auto") !== "0", snapshots: QS.get("snap") !== "0", v9: QS.get("v9") !== "0" }); access = mock.access;
        window.fm1Test = { mock, roll: () => ({ RG, cell: roll.cell, grid: roll.el && roll.el.grid, scroll: roll.el && roll.el.scroll }) };   /* (?mock=1 only: the e2e) */
      }
      else {
        const m = await openMidi(navigator);
        if (m.st !== "ok") { sayK(m.st); return; }
        access = m.access;
      }
      access.onstatechange = onState;
    }
    const ports = findPorts(access);
    if (!ports) { sayK("nodevice"); return; }
    const { input, output } = ports;
    const link = new Link((d) => output.send(d), {
      timeout: 300,
      onUnknown: (f) => console.debug("ignored reply", f),
      onTimeout: () => sayK("noreply"),
      onPush: (f) => onPush(f),
      onGap: () => { rewatch = true; },
    });
    input.onmidimessage = (e) => link.receive(e.data);
    if (input.open) await input.open().catch(() => {});
    dev = { link, input, output, info: null, pdesc: [], gdesc: [], names: [], dump: null, steps: [], slotUsed: [null, null, null, null],
      keys: null, watch: false, bank: null, fm6: null };
    await load(dev);
  } catch (e) {
    console.error(e);
    if (dev) {                                       /* not unplugged meanwhile (that says "lost") */
      const timeout = /^timeout/.test(e.message);
      disconnect();
      sayK(timeout ? "noreply" : "error", timeout ? "" : e.message);
    }
  } finally {
    $("connect").disabled = false;
  }
}

function disconnect(reasonKey = "disconnected") {
  closePop();
  if (dev) {
    dev.link.close();
    dev.input.onmidimessage = null;
  }
  dev = null;
  busy = 0;
  needReload = false;
  renderPanels();
  renderMixer();
  renderSysinfo();
  renderLive();
  renderLib();
  renderBank();
  renderFm6();
  renderTransport();
  $("version").textContent = "";
  sayK(reasonKey);
}

function onState(e) {
  const p = e.port;
  if (!p || !/felucca|optimist/i.test(p.name || "")) return;
  if (dev && p.state === "disconnected" && (p.id === dev.input.id || p.id === dev.output.id)) {
    disconnect("lost");
  } else if (wantsReconnect(e, !!dev, wantConnected)) {
    clearTimeout(onState.tm);                       /* the device came (back): connect */
    onState.tm = setTimeout(() => { if (!dev && wantConnected) connect(); }, 800);
  }
}

const rq = (r, opt) => dev.link.request(r, opt);
async function getDesc(scope, id) { return parse[CMD.DESC](await rq(req.desc(scope, id))); }
async function getDump() { lastDump = Date.now(); return parse[CMD.DUMP](await rq(req.dump()), dev.info); }
async function getStep(i) { return parse[CMD.STEP_GET](await rq(req.stepGet(i))); }
async function getDrumStep(i) { return parse[CMD.DRUM_STEP](await rq(req.drumStep(i))); }
/* a drum step as an old step (firmware ed_dstep_old): for what still reads dev.steps */
function drumAsStep(d) {
  const notes = [];
  for (let l = 0; l < 16 && notes.length < 4; l++) if ((d.on >> l) & 1) notes.push(DRUM_LANES[l][0]);
  return { index: d.index, n: notes.length, notes: [...notes, 0, 0, 0, 0].slice(0, 4), time: notes.length ? 0 : 2, flags: 0, vel: notes.length ? 100 : 0 };

/* the whole connect sequence */
async function load(d) {
  busy++;
  try {
    /* the first frame after opening the port can be lost: a few tries */
    d.info = parse[CMD.INFO](await d.link.request(req.info(), { timeout: 500, retries: 3 }));
    $("version").textContent = d.info.version;
    const total = d.info.pcount + d.info.gcount;
    for (let i = 0; i < d.info.pcount; i++) { sayK("reading", `${i + 1}/${total}`); d.pdesc[i] = await getDescOrNull(0, i); }
    for (let i = 0; i < d.info.gcount; i++) { sayK("reading", `${d.info.pcount + i + 1}/${total}`); d.gdesc[i] = await getDescOrNull(1, i); }
    const kd = d.pdesc[d.info.pe0];
    if (kd && kd.label === "KIT" && kd.names.length) d.kitNames = kd.names;   /* (the drum track was selected) */
    d.titles = [];
    for (let e = 0; e < d.info.nengines; e++) {
      const r = parse[CMD.NAMES](await d.link.request(req.names(e)));
      d.names[e] = r.names;
      d.titles[e] = r.titles;
    }
    for (let k = 0; k < 4; k++) {                    /* PROJECT op 2: is the slot used */
      try { d.slotUsed[k] = parse[CMD.PROJECT](await d.link.request(req.project(2, k))).used; }
      catch (e) { if (e.message === "closed") throw e; }
    }
    try { d.smp = parse[CMD.SMP_INFO](await d.link.request(req.smpInfo())); }
    catch (e) { if (e.message === "closed") throw e; d.smp = null; }   /* older firmware, or no flash */
    await drumsReadOrNone(d);                         /* the drum lanes, the user kits (none: older firmware) */
    d.pages = await readDevicePages((r, o) => d.link.request(r, o));   /* the device's pages (null: older firmware, LAYOUT) */
    try { d.sn = parse[CMD.SN_LIST](await d.link.request(req.snList(), { timeout: 400, retries: 0, quiet: true })); }
    catch (e) { if (e.message === "closed") throw e; d.sn = null; }   /* (older firmware: no snapshots) */
    try { d.bk = parse[CMD.BK_LIST](await d.link.request(req.bkList(), { timeout: 400, retries: 0, quiet: true })); }
    catch (e) { if (e.message === "closed") throw e; d.bk = null; }   /* (older firmware: no backup) */
    d.keys = paramKeys(d.pdesc, d.info.pe0, d.info.pcount);
    await libAdopt(d);
    if (d.info.ntrk) d.sel = parse[CMD.TRACK](await d.link.request(req.track())).sel;   /* v3: the selected track */
    d.dump = await getDump();
    buildUI();
    renderPanels();
    await loadSteps();
    if (d.info.ntrk) await readMixer();
    if (d.info.ntrk) for (let i = 0; i < d.info.ntrk; i++) { sayK("steploading", `${t("track")} ${i + 1}`); await readOverview(i); }   /* the strips' step overviews */
    /* protocol v2: live pushes and the user bank; older firmware: DUMP polling, no bank */
    const rqd = (r, o) => d.link.request(r, o);
    Object.assign(d, watchCaps(await startWatch(rqd)));   /* v4: TRACK_PARAM / TRACK_CHANGED; v9: pushes for everything, the stream */
    if (d.stream) { d.statusOk = true; renderTransport(); if (d.mix) { mixCtl.length = 0; renderMixer(); } }   /* (the stream carries STATUS; the meters) */
    if (d.watch) {
      sayK("readingBank");
      try { d.bank = await bank.list((r, o) => d.link.request(r, { ...o, quiet: true })); }
      catch (e) { if (e.message === "closed") throw e; d.bank = null; }
    }
    if (d.info.engines.includes("FM6")) {           /* the FM6 user bank: a 32-voice DX7 dump */

      try { d.fm6 = fm6State(await d.link.readFM6Bank()); }
      catch (e) { if (e.message === "closed") throw e; d.fm6 = null; }
    }

    renderLib();
    renderBank();
    renderFm6();
    renderSysinfo();
    renderKit();
    renderSnaps();
    renderBackup();

}
async function getDescOrNull(s, i) { try { return await getDesc(s, i); } catch (e) { if (e.message === "closed") throw e; return null; } }

/* rebuilds the controls only when the engine or its parameters changed (a slider being dragged survives) */
async function rereadEngineDesc() {
  const pe0 = dev.info.pe0;
  const before = JSON.stringify(dev.pdesc.slice(pe0));
  for (let i = 0; i < 8 && pe0 + i < dev.info.pcount; i++) dev.pdesc[pe0 + i] = await getDescOrNull(0, pe0 + i);
  const kd = dev.pdesc[pe0];
  if (kd && kd.label === "KIT" && kd.names.length) dev.kitNames = kd.names;   /* the drum track's kits, for the mixer */
  const pb = JSON.stringify(dev.pages);              /* the pages shown follow the engine and the track (PAGES) */
  if (dev.pages) dev.pages = await readDevicePages(rq) || dev.pages;
  if (dev.built !== dev.dump.engine || JSON.stringify(dev.pdesc.slice(pe0)) !== before || JSON.stringify(dev.pages) !== pb) buildGroups();

async function loadSteps() {

  for (let i = 0; i < n; i++) {

    else dev.steps[i] = await getStep(i);

function visible(d) { return d && d.max > d.min && d.label !== "-"; }

function buildGroups() {
  ctl.clear();
  dev.built = dev.dump.engine;
  /* Sound: the selected track's parameters (knobs; the device's pages when it gives them, PAGES, else the editor's LAYOUT);
     Sequencer: its pattern settings; Settings: globals and drums */
  const groups = { groups: [], seqgroups: [], setgroups: [] };
  const { info } = dev;
  const layoutOk = EXPECTS.some((x) => info.pcount === x.pcount && info.gcount === x.gcount && info.pe0 === x.pe0);
  const group = (g, knobs) => {
    const div = el("div", { class: "group", "data-fam": g.t.toLowerCase() },
      el("h2", { ic: HEAD_IC[g.t], text: g.engine ? `EDIT ${info.engines[dev.dump.engine] || ""}` : g.t }));
    let eng = 0;
    for (const [title, s, ids] of g.pages) {
      const items = ids.map((id) => (knobs ? paramKnob(s, id, title) : paramRow(s, id, title))).filter(Boolean);
      if (!items.length) continue;
      const tt = g.engine && !dev.pages && (dev.titles[dev.dump.engine] || [])[g.pages.findIndex((x) => x[0] === title)];
      if (g.pages.length > 1 || (knobs && (tt || title) !== g.t)) div.append(el("h3", { ic: PAGE_IC[tt || title], text: tt || title }));
      if (knobs) div.append(el("div", { class: "knobs" }, ...items)); else div.append(...items);
      eng++;
    }
    return eng ? div : null;
  };
  if (dev.pages && dev.pages.length) {
    const sg = soundLayout(dev.pages, dev.titles[dev.dump.engine] || []);
    const fx = sg.find((g) => g.fam === FAM.FX), fxoff = pFxoff();
    if (fx && dev.pdesc[fxoff] && !dev.pages.some((p) => p.scope === 0 && p.ids.includes(fxoff))) fx.pages.push(["BYPASS", 0, [fxoff]]);
    groups.groups.push(...sg.map((g) => group(g, true)).filter(Boolean));
  } else if (layoutOk) {
    groups.groups.push(...LAYOUT(info.pe0, [61, 64, 67].includes(info.pe0) && info.engines[dev.dump.engine] === "ANALOG")
      .filter((g) => !g.tab).map((g) => group(g, true)).filter(Boolean));
  }
  if (layoutOk) {
    for (const g of LAYOUT(info.pe0, false).filter((x) => x.tab)) { const d = group(g, true); if (d) groups[g.tab].push(d); }
  } else if (dev.pages && dev.pages.length) {
    /* another firmware layout: its PATTERN and global pages from the device */
    for (const p of dev.pages.filter((x) => x.shown && ((x.fam === FAM.SEQ && x.scope === 0) || (x.fam === FAM.GLO && x.scope === 1)))) {
      const d = group({ t: p.title, pages: [[p.title, p.scope, p.ids.filter((i) => i !== 127)]] }, true);
      if (d) groups[p.fam === FAM.SEQ ? "seqgroups" : "setgroups"].push(d);
    }
  }
  if (!layoutOk && !(dev.pages && dev.pages.length)) {
    /* unknown firmware layout: everything in id order */
    const a = el("div", { class: "group" }, el("h2", { ic: HEAD_IC.INSTRUMENT, text: "INSTRUMENT" }), el("p", { class: "dim", text: t("layout") }));
    const b = el("div", { class: "group" }, el("h2", { ic: HEAD_IC.EDIT, text: "EDIT" }));
    const c = el("div", { class: "group" }, el("h2", { ic: HEAD_IC.GLOBAL, text: "GLOBAL" }));
    for (let i = 0; i < info.pcount; i++) { const r = paramRow(0, i); if (r) (i >= info.pe0 ? b : a).append(r); }
    for (let i = 0; i < info.gcount; i++) { const r = paramRow(1, i); if (r) c.append(r); }
    groups.groups.push(a, b);
    groups.setgroups.push(c);
  }
  for (const [id, divs] of Object.entries(groups)) $(id).replaceChildren(...divs);
  /* the tempo lives in the transport bar only: its input follows pushes / polling like any control */
  const bi = dev.gdesc.findIndex((d) => d && d.label === "BPM");
  $("bpmbox").hidden = bi < 0;
  if (bi >= 0) {
    $("bpm").min = String(dev.gdesc[bi].min);
    $("bpm").max = String(dev.gdesc[bi].max);
    ctl.set(key(1, bi), { input: $("bpm"), out: { set textContent(x) { /* the input shows it */ } }, desc: dev.gdesc[bi], scope: 1, id: bi, row: null });
    showValue(key(1, bi), dev.dump.g[bi], document.activeElement !== $("bpm"));
  }
}

/* a parameter as a knob (an enum, a note, ON / OFF: a dropdown with its label), for the Sound tab; registered in ctl

function paramKnob(s, id, title) {

const smpDraft = [0, 1, 2].map(() => ({ name: "", files: [] }));
let smpBusy = false;
const SMP_RC = { 1: "size", 2: "header", 3: "data CRC", 4: "flash", 5: "zones" };
const kib = (n) => (n / 1024).toFixed(1);

/* auto key split, as in buildSlot (for the preview) */
function splitKeys(files) {
  const z = files.map((f, i) => ({ i, root: f.root })).sort((a, b) => a.root - b.root);
  const out = [];
  z.forEach((x, j) => {
    out[x.i] = [j === 0 ? 0 : Math.floor((z[j - 1].root + x.root) / 2) + 1, j === z.length - 1 ? 127 : Math.floor((x.root + z[j + 1].root) / 2)];
  });
  files.forEach((f, i) => { if (f.lo != null) out[i] = [f.lo, f.hi]; });   /* (chops: their own keys) */
  return out;
}

const draftBytes = (d) => d.files.reduce((a, f) => a + ((f.s.length + 1) >> 1), 0);

async function decodeFile(f) {
  const buf = await f.arrayBuffer();
  let x;
  try {
    const w = parseWav(buf);
    x = resample(w.x, w.sr, SMP.RATE);
  } catch (e) {                                     /* not a plain WAV: let the browser decode it */
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ab = await new Ctx(1, 1, SMP.RATE).decodeAudioData(buf.slice(0));
    x = new Float64Array(ab.length);
    for (let c = 0; c < ab.numberOfChannels; c++) { const d = ab.getChannelData(c); for (let i = 0; i < d.length; i++) x[i] += d[i] / ab.numberOfChannels; }
  }
  if (!x.length) throw new Error("no audio");
  return { fname: f.name, s: normalize(x), root: rootFromName(f.name.replace(/\.[^.]*$/, "")) };
}

async function addFiles(k, list) {
  const d = smpDraft[k];
  for (const f of list) {
    try {
      const z = await decodeFile(f);
      if (d.files.length >= SMP.MAX_ZONES) break;
      d.files.push(z);
      if (!d.name) d.name = f.name.replace(/\.[^.]*$/, "").toUpperCase().replace(/[^\x20-\x7E]/g, "").slice(0, 8);
    } catch (e) { sayK("smpDecodeFail", `${f.name} (${e.message})`); }
  }

}

    await fm6Reread();                              /* (an upload into the slot holding the FM6 bank replaces it) */
    busy--;
  }
  return done;
}

/* ------------------------------------------------------------ BACKUP --- */
/* Backup: every stored object the device lists (BK_LIST), read in CRC-checked chunks, into one .optimist-backup file;
   the sample slots only when asked (large), the slot holding the FM6 user bank always. Restore: the objects ticked,
   each through the device's own power-safe path (storage objects: BK_BEGIN / DATA / COMMIT, the old copy kept until
   the new one is written; sample slots: the sample upload; the FM6 bank: its DX7 bank SysEx, last), then BK_END:
   the device restarts and loads it all (its usual migrations). Stopped only. */
const bkDraft = { file: null, sel: {}, samples: false, busy: false, name: "" };
const bkLabel = (tag) => BK.NAMES[tag] || tag;
function bkProgress(v) { const p = $("bkprog"); if (p) { p.hidden = v == null; p.value = v || 0; } }
async function bkReadAll(withSamples, prog) {
  const L = parse[CMD.BK_LIST](await rq(req.bkList(), { timeout: 1500, retries: 1 }));
  const pick = L.objs.filter((o) => o.hasData && (o.kind !== "usr" || o.fm6 || withSamples));
  const total = pick.reduce((s, o) => s + o.len, 0) || 1;
  let done = 0;
  const objects = [];
  for (const o of pick) {
    const data = new Uint8Array(o.len);
    for (let off = 0, tries = 0; off < o.len;) {
      const r = parse[CMD.BK_READ](await rq(req.bkRead(o.i, off), { timeout: 1500, retries: 2 }));
      const c = Uint8Array.from(r.data).subarray(0, o.len - off);
      if (r.i !== o.i || r.off !== off || !c.length || crc32(Uint8Array.from(r.data)) !== r.crc) {
        if (++tries > 2) throw new Error(`${o.tag}: ${t("bkBadChunk")} ${off}`);
        continue;
      }
      tries = 0;
      data.set(c, off);
      off += c.length;
      done += c.length;
      if (prog) prog(done / total, o.tag);
    }
    if (crc32(data) !== o.crc) throw new Error(`${o.tag}: CRC`);
    objects.push({ tag: o.tag, kind: o.kind, fm6: o.fm6, data });
  }
  return { list: L, objects };
}
async function bkWriteObj(i, data, prog) {     /* one storage object: BEGIN, DATA (a chunk again on rc 2), COMMIT */
  let r = parse[CMD.BK_BEGIN](await rq(req.bkBegin(i, data.length, crc32(data)), { timeout: 4000, retries: 0 }));
  if (r.rc) throw new Error(`BEGIN: ${BK.RC[r.rc] || r.rc}`);
  for (let off = 0, tries = 0; off < data.length;) {
    const c = data.subarray(off, off + BK.CHUNK);
    r = parse[CMD.BK_DATA](await rq(req.bkData(i, off, c), { timeout: 1500, retries: 1 }));
    if (r.rc === 2 && ++tries <= 2) continue;
    if (r.rc) throw new Error(`DATA ${off}: ${BK.RC[r.rc] || r.rc}`);
    tries = 0;
    off += c.length;
    if (prog) prog(c.length);
  }
  r = parse[CMD.BK_COMMIT](await rq(req.bkCommit(i), { timeout: 4000, retries: 0 }));
  if (r.rc) throw new Error(`COMMIT: ${BK.RC[r.rc] || r.rc}`);
}
async function bkRestore(file, sel, prog) {
  const L = parse[CMD.BK_LIST](await rq(req.bkList(), { timeout: 1500, retries: 1 }));
  const plan = bkPlan(file, L).filter((x) => sel[x.o.tag] && !x.why);
  const total = plan.reduce((s, x) => s + x.o.data.length, 0) || 1;
  let done = 0;
  const step = (n) => { done += n; if (prog) prog(done / total); };
  const skipped = bkPlan(file, L).filter((x) => sel[x.o.tag] && x.why).map((x) => x.o.tag);
  for (const x of plan.filter((x) => x.o.kind !== "usr" && x.o.kind !== "snp")) { await bkWriteObj(x.d.i, x.o.data, step); }
  for (const x of plan.filter((x) => x.o.kind === "usr" && !x.o.fm6)) {
    const p = bkSlotParts(x.o.data);
    if (!await smpSend(+x.o.tag[3] - 1, p.hdr, p.data)) throw new Error(`${x.o.tag}: ${t("smpFail")}`);
    step(x.o.data.length);
  }
  for (const x of plan.filter((x) => x.o.kind === "snp")) {   /* the snapshots: each slot through the import */
    const L2 = parse[CMD.SN_LIST](await rq(req.snList(), { timeout: 1500, retries: 1 }));
    for (const s of snAreaStreams(x.o.data)) {
      if (!L2.slots[s.slot] || !L2.slots[s.slot].shown) { skipped.push(`SNAP ${snLabel(s.slot)}`); continue; }
      await snWriteAll(rq, s.slot, s.stream);
    }
    step(x.o.data.length);
  }
  for (const x of plan.filter((x) => x.o.fm6)) {   /* last: it finds its slot among the restored ones */
    await dev.link.writeFM6Bank(Array.from(x.o.data.subarray(0x1000, 0x1000 + 4096)));
    step(x.o.data.length);
  }
  const e = parse[CMD.BK_END](await rq(req.bkEnd(true), { timeout: 1500, retries: 0 }));
  return { written: plan.map((x) => x.o.tag), skipped, rc: e.rc };
}
async function backupDo() {
  bkDraft.busy = true;
  renderBackup();
  await op(async () => {
    const r = await bkReadAll(bkDraft.samples, (v, tag) => { bkProgress(v); sayK("bkReading", bkLabel(tag)); });
    const d = dev.info || {};
    const file = backupFile({ version: d.version, proto: d.proto, switches: r.list.switches, magic: r.list.magic, bk: r.list.version,
      caps: r.list.caps },
      r.objects);
    saveBlob(`optimist-${new Date().toISOString().slice(0, 10)}.optimist-backup`, new Blob([file], { type: "application/octet-stream" }));
    sayK("bkSaved", `${r.objects.length} / ${kib(file.length)} KiB`);
  });
  bkProgress(null);
  bkDraft.busy = false;
  renderBackup();
}
async function restoreDo() {
  const f = bkDraft.file, n = Object.values(bkDraft.sel).filter(Boolean).length;
  const rep = f && dev && dev.bk ? bkReport(f, dev.bk) : [];
  if (!f || !n || !confirm(t("bkConfirm").replace("{n}", n) + (rep.length ? "\n\n" + t("bkReport") + "\n" + rep.join("\n") : ""))) return;
  bkDraft.busy = true;
  renderBackup();
  await op(async () => {
    const r = await bkRestore(f, bkDraft.sel, bkProgress);
    sayK("bkRestored", `${r.written.length}${r.skipped.length ? " (" + t("bkSkipped") + r.skipped.join(" ") + ")" : ""}`);
  });
  bkProgress(null);
  bkDraft.busy = false;
  renderBackup();
}
function renderBackup() {
  const box = $("backup");
  if (!box) return;
  if (!dev || !dev.bk) { box.replaceChildren(el("p", { class: "dim", text: dev ? t("bkNone") : "" })); return; }
  const L = dev.bk, usr = L.objs.filter((o) => o.kind === "usr" && o.hasData && !o.fm6).reduce((s, o) => s + o.len, 0);

  const smp = el("input", { type: "checkbox", checked: bkDraft.samples, disabled: bkDraft.busy });

  file.addEventListener("change", async () => {
    const fl = file.files[0];

    if (!fl) return;

      bkDraft.name = fl.name;

  const rows = [el("p", { class: "bar" },
    el("button", { ic: "symbol_download", disabled: bkDraft.busy, onclick: () => backupDo() }, t("bkBackup")),
    el("label", {}, smp, " ", t("bkSamples").replace("{n}", kib(usr))),
    el("span", { class: "dim", text: `${kib(all)} KiB` + (bkDraft.samples ? ` + ${kib(usr)} KiB` : "") }),
    el("button", { ic: "symbol_upload", disabled: bkDraft.busy, onclick: () => file.click() }, t("bkRestore")), file)];
  if (bkDraft.file) {
    const tb = el("table", { class: "ukits" });

    rows.push(el("p", { class: "dim", text: `${bkDraft.name}: ${dv.version || "?"} ${dv.magic || ""}, ${bkDraft.file.created || ""}` }));
    bkPlan(bkDraft.file, L).forEach((x) => {
      const c = el("input", { type: "checkbox", checked: !!bkDraft.sel[x.o.tag], disabled: bkDraft.busy || !!x.why });
      c.addEventListener("change", () => { bkDraft.sel[x.o.tag] = c.checked; });
      tb.append(el("tr", {}, el("td", {}, c), el("td", { text: x.o.tag }), el("td", { text: bkLabel(x.o.tag) + (x.o.fm6 ? " (FM6)" : "") }),
        el("td", { class: "dim", text: `${kib(x.o.data.length)} KiB` }), el("td", { class: x.why ? "bad" : "dim", text: x.why ? t(x.why) : "" })));
    });
    const rep = bkReport(bkDraft.file, L);
    if (rep.length) rows.push(el("p", { class: "dim", text: t("bkReport") }), el("pre", { class: "dim", text: rep.join("\n") }));
    rows.push(tb, el("p", { class: "bar" }, el("button", { ic: "symbol_upload", disabled: bkDraft.busy, onclick: () => restoreDo() }, t("bkRestoreGo")),
      el("span", { class: "dim", text: t("bkStopped") })));
  }

}

/* Snapshots (the Projects screen): the slots of the FM-1 (name, size, state in the status colours: green saved, amber
   another build's, red damaged), Save / Load / Clear / Rename on the device, Export to a .optimist-snap file and Import
   one into a slot. Stopped only (the FM-1 refuses while it plays: a flash erase stops the audio). */
const snDraft = { busy: false };
function snProgress(v) { const p = $("snprog"); if (p) { p.hidden = v == null; p.value = v || 0; } }
async function snRefresh() {
  if (!dev) return;
  try { dev.sn = parse[CMD.SN_LIST](await rq(req.snList(), { timeout: 800, retries: 1, quiet: true })); }
  catch (e) { if (e.message === "closed") throw e; dev.sn = null; }
  renderSnaps();
}
const snErr = (rc) => new Error(SN.RC[rc] || `rc ${rc}`);
async function snOpDo(opn, k) {
  const n = snLabel(k);
  if (opn === 0 && dev.sn.slots[k].state !== "empty" && !confirm(t("snConfirmSave").replace("{n}", n))) return;
  if (opn === 1 && !confirm(t("snConfirmLoad").replace("{n}", n))) return;
  if (opn === 2 && !confirm(t("snConfirmClear").replace("{n}", n))) return;
  let name = "";
  if (opn === 0 || opn === 3) {
    name = prompt(t("snNameAsk"), opn === 3 ? dev.sn.slots[k].name : "");
    if (name == null) return;

  }
  snDraft.busy = true;

  await op(async () => {
    if (opn === 1) selfLoad();
    const r = parse[CMD.SN_OP](await rq(req.snOp(opn, k, name), { timeout: 8000, retries: 0 }));
    if (r.rc) throw snErr(r.rc);
    if (opn === 1) {

}
async function snExportDo(k) {
  const s = dev.sn.slots[k];
  snDraft.busy = true;
  renderSnaps();
  await op(async () => {
    const st = await snReadAll(rq, k, s.size, snProgress);
    const nm = (snInfo(st).name || `snapshot-${snLabel(k)}`).replace(/[^\w.-]+/g, "_");
    saveBlob(`${nm}.optimist-snap`, new Blob([snapFile(st)], { type: "application/octet-stream" }));
    sayK("snExported", `${nm} (${kib(st.length)} KiB)`);
  });
  snProgress(null);
  snDraft.busy = false;
  renderSnaps();
}
async function snImportDo(k, fl) {
  let st;
  try { st = readSnapFile(new Uint8Array(await fl.arrayBuffer())); } catch (e) { sayK("snBadFile", e.message); return; }
  if (dev.sn.slots[k].state !== "empty" && !confirm(t("snConfirmImport").replace("{n}", snLabel(k)))) return;
  snDraft.busy = true;
  renderSnaps();
  await op(async () => {
    await snWriteAll(rq, k, st, snProgress);

}
function renderSnaps() {
  const box = $("snaps");
  if (!box) return;

  if (!L) { box.replaceChildren(el("p", { class: "dim", text: dev ? t("snNone") : "" })); return; }
  const tb = el("table", { class: "snaps" }), dis = snDraft.busy;

    const what = good ? [`${s.bpm} BPM`, s.secmask ? `${t("snSections")} ${snSections(s.secmask)}` : "", s.parts ? `${t("snSong")} ${s.parts}` : ""]
      .filter(Boolean).join(" · ") : "";

        : el("span", { class: "dim", text: t("snEmpty") })),

        el("button", { disabled: dis || !good, onclick: () => snOpDo(3, k) }, t("snRename")),
        el("button", { ic: "symbol_download", disabled: dis || !good, onclick: () => snExportDo(k) }, t("snExport")),
        el("button", { ic: "symbol_upload", disabled: dis, onclick: () => file.click() }, t("snImport")), file,

async function smpErase(k) {
  if (!dev || !confirm(t("confirmErase").replace("{n}", k + 1))) return;
  busy++;
  smpBusy = true;
  renderSamples();
  try {
    const r = parse[CMD.SMP_ERASE](await rq(req.smpErase(k), { timeout: 2500, retries: 0 }));
    if (r.rc) throw new Error("erase rc " + r.rc);
    sayK("smpErased", String(k + 1));
  } catch (e) {
    if (e.message !== "closed") sayK("smpFail", e.message);

/* ---------------------------------------------------------------- CHOP --- */
/* Load a recording, mark the chops (live: TAP / space while it plays, each tap moved to the hit it
   meant; or by hits, a tempo grid, equal parts; double-click adds, drag moves, Delete removes),
   audition them (click, keys 1-9 0), keep or leave out each one and set its length (a recording longer
   than a slot: keep the chops you want, shorten them, or Fit to slot), then one chop per key into
   USR1..3 or as WAV files. CH.opt[i] = {off, len} goes with marker i. */
const CH = { x: null, nov: null, name: "", marks: [], opt: [], sel: -1, v0: 0, v1: 1, ctx: null, src: null, t0: 0, raf: 0,
  drag: -1, dragEnd: false, key0: 60, mode: 0, maxLen: 0, ui: null };
const chR = () => SMP.RATE;
const chSecs = (n) => (n / SMP.RATE).toFixed(2) + " s";

function chopChops() { return CH.x ? chopList(CH.marks, CH.x.length, Math.round(CH.maxLen * SMP.RATE), CH.opt) : []; }
function chopUsed() {                                /* the chops the slot gets, their samples, and each chop's key */
  const c = chopChops(), use = chopPick(c, CH.mode, Math.max(0, CH.sel)), key = new Map();
  if (CH.mode === 0) use.forEach((q, j) => key.set(q.i, Math.min(127, CH.key0 + j)));
  return { all: c, use, n: use.reduce((a, q) => a + (q.end - q.start), 0), key };
}
/* the label of chop i: its key, "—" when left out, nothing past the 16 kept ones or over the whole keyboard */
function chopKeyName(u, i) {
  if (CH.mode === 1) return "";
  const c = u.all[i];
  return c && c.off ? " —" : u.key.has(i) ? " " + noteName(u.key.get(i)) : "";
}
function chopOpt(i) { return CH.opt[i] || (CH.opt[i] = { off: false, len: 0 }); }
function chopKeep(i, keep) {                         /* keep / leave out chop i (keep undefined: toggle) */
  if (!CH.x || i < 0 || i >= CH.marks.length) return;
  const o = chopOpt(i);
  o.off = keep === undefined ? !o.off : !keep;
  chopRender();
}
function chopKeepAll(keep) { if (CH.x) { CH.opt = CH.marks.map((_, i) => ({ ...chopOpt(i), off: !keep })); chopRender(); } }
function chopSetLen(i, len) {                        /* the length of chop i in samples (0: up to the next marker) */
  if (!CH.x || i < 0 || i >= CH.marks.length) return;
  chopOpt(i).len = Math.max(0, Math.round(len));
  chopRender();
}
function chopFitAll() {                              /* shorten the longest kept chops so they all fit the slot */
  const { use } = chopUsed(), L = chopFit(use, SMP.MAX_DATA * 2 - use.length);   /* (an odd chop takes half a byte more) */
  if (!isFinite(L)) return;
  for (const c of use) if (c.end - c.start > L) chopOpt(c.i).len = L;
  sayK("chopFitted", chSecs(L));
  chopRender();
}

async function chopDecode(buf) {                    /* any file the browser decodes -> mono Float64 at SMP.RATE */
  try { const w = parseWav(buf); return resample(w.x, w.sr, SMP.RATE); } catch (e) { /* not a plain WAV */ }
  const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ab = await new Ctx(1, 1, SMP.RATE).decodeAudioData(buf.slice(0));
  const x = new Float64Array(ab.length);
  for (let c = 0; c < ab.numberOfChannels; c++) { const d = ab.getChannelData(c); for (let i = 0; i < d.length; i++) x[i] += d[i] / ab.numberOfChannels; }
  return x;
}

async function chopLoad(f) {
  chopStop();
  try {
    const x = await chopDecode(await f.arrayBuffer());
    if (!x.length) throw new Error("no audio");
    CH.x = x;
    CH.nov = chopNovelty(x);
    CH.name = f.name.replace(/\.[^.]*$/, "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || "CHOP";
    CH.marks = [];
    CH.opt = [];
    CH.sel = -1;
    CH.v0 = 0;
    CH.v1 = x.length;
    sayK("chopLoaded", `${f.name} (${chSecs(x.length)})`);
  } catch (e) { sayK("smpDecodeFail", `${f.name} (${e.message})`); }
  chopRender();
}

/* new markers; opt (aligned with m) their options, else each keeps the options of the marker it was */
function chopSetMarks(m, opt = null) {
  const was = new Map(CH.marks.map((v, i) => [v, CH.opt[i]])), seen = new Set(), pairs = [];
  m.forEach((v, i) => {
    const p = Math.max(0, Math.min(CH.x.length - 1, Math.round(v)));
    if (seen.has(p)) return;
    seen.add(p);
    const o = opt ? opt[i] : was.get(p);
    pairs.push([p, o ? { ...o } : { off: false, len: 0 }]);
  });
  pairs.sort((a, b) => a[0] - b[0]);
  CH.marks = pairs.map((q) => q[0]);
  CH.opt = pairs.map((q) => q[1]);
  if (CH.sel >= CH.marks.length) CH.sel = CH.marks.length - 1;
  chopRender();
}
function chopAdd(pos) {                              /* a new marker; one within 30 ms is moved there instead */
  const near = CH.marks.findIndex((m) => Math.abs(m - pos) < 0.03 * chR());
  const m = CH.marks.slice(), opt = CH.marks.map((_, i) => CH.opt[i]);
  if (near >= 0) m[near] = pos; else { m.push(pos); opt.push(null); }
  chopSetMarks(m, opt);
  CH.sel = CH.marks.indexOf(Math.round(pos));
  chopDraw();
}

/* ---- audio */
function chopCtx() {
  if (!CH.ctx) CH.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (CH.ctx.state === "suspended") CH.ctx.resume();
  return CH.ctx;
}
function chopBuffer(a, b) {
  const ctx = chopCtx(), n = Math.max(1, b - a), buf = ctx.createBuffer(1, n, SMP.RATE), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = CH.x[a + i];
  return buf;
}
function chopStop() {
  if (CH.src) { try { CH.src.stop(); } catch (e) { /* ended */ } CH.src = null; }
  cancelAnimationFrame(CH.raf);
  if (CH.ui) { CH.ui.play.textContent = t("chopPlay"); chopDraw(); }
}
/* play a..b; whole = the transport (a playhead, TAP marks), else an audition */
function chopPlay(a, b, whole) {
  if (!CH.x) return;
  chopStop();
  const ctx = chopCtx(), src = ctx.createBufferSource();
  const g = ctx.createGain();
  src.buffer = chopBuffer(a, b);
  src.connect(g).connect(ctx.destination);

  CH.src = src;
  CH.src.whole = whole;
  if (whole) {

/* where the listener is now, in samples (what comes out of the speakers, not what is computed) */
function chopHeard(ev) {

  let ct = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
  if (ev && ctx.getOutputTimestamp) {
    const ts = ctx.getOutputTimestamp();
    if (ts.performanceTime > 0) ct = ts.contextTime + (ev.timeStamp - ts.performanceTime) / 1000;

  return (ct - CH.t0) * SMP.RATE;

function chopTap(ev) {                               /* TAP while it plays: a marker on the hit you meant */
  if (!CH.src || !CH.src.whole) return;
  const p = chopHeard(ev);
  if (p < 0 || p >= CH.x.length) return;

}

/* ---- drawing (the page's own two colours) */
function chopDraw() {
  const u = CH.ui;

  const cv = u.cv, dpr = window.devicePixelRatio || 1, W = Math.max(200, cv.clientWidth), Hh = 150;
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); }
  const g = cv.getContext("2d"), cs = getComputedStyle(document.documentElement);
  const FG = cs.getPropertyValue("--fg").trim(), DIM = cs.getPropertyValue("--dim").trim(), LINE = cs.getPropertyValue("--line").trim();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, Hh);
  if (!CH.x) { g.fillStyle = DIM; g.font = "12px sans-serif"; g.fillText(t("chopDrop"), 8, Hh / 2); return; }
  const x = CH.x, v0 = CH.v0, span = CH.v1 - CH.v0, X = (p) => (p - v0) / span * W, mid = Hh / 2 + 6;
  const U = chopUsed(), { all: chops, use } = U;
  const hatch = (a, b) => {                          /* what the slot does not get */
    g.save(); g.beginPath(); g.rect(a, 12, b - a, Hh - 12); g.clip(); g.strokeStyle = LINE;
    for (let q = Math.floor(a / 8) * 8 - 8; q < b; q += 8) { g.beginPath(); g.moveTo(q, Hh); g.lineTo(q + 8, 12); g.stroke(); }
    g.restore();

  if (chops.length && chops[0].start > 0) hatch(X(0), X(chops[0].start));
  chops.forEach((c, i) => {                          /* the chops: the selected one filled, left-out parts hatched */
    const a = X(c.start), b = X(c.end), f = X(c.full);

    if (i === CH.sel) { g.fillStyle = LINE; g.fillRect(a, 12, b - a, Hh - 12); }
    if (!use.includes(c)) hatch(a, f); else if (c.end < c.full) hatch(b, f);
  });
  g.fillStyle = FG;
  for (let px = 0; px < W; px++) {                   /* the wave: min / max per pixel */
    const a = Math.floor(v0 + px / W * span), b = Math.min(x.length, Math.max(a + 1, Math.floor(v0 + (px + 1) / W * span)));
    let lo = 0, hi = 0;
    for (let i = a; i < b; i += Math.max(1, (b - a) >> 6)) { if (x[i] < lo) lo = x[i]; if (x[i] > hi) hi = x[i]; }
    g.fillRect(px, mid - hi * (Hh / 2 - 8), 1, Math.max(1, (hi - lo) * (Hh / 2 - 8)));
  }
  g.font = "10px sans-serif";
  CH.marks.forEach((m, i) => {                       /* the markers, numbered; the chop's key above */
    const px = X(m);
    if (px < -1 || px > W + 1) return;
    g.fillStyle = FG;
    g.fillRect(Math.round(px), 0, i === CH.sel ? 2 : 1, Hh);
    g.fillText(String(i + 1) + chopKeyName(U, i), px + 3, 10);
  });
  const sc = chops[CH.sel];
  if (sc) {                                          /* the selected chop's end: a handle at the bottom, drag it */
    const px = Math.round(X(sc.end));
    g.fillStyle = FG;
    g.fillRect(px - 1, Hh - 30, 2, 30);
    g.beginPath(); g.moveTo(px, Hh - 30); g.lineTo(px - 7, Hh - 38); g.lineTo(px - 7, Hh - 22); g.closePath(); g.fill();
  }
  if (CH.src && CH.src.whole && CH.ctx) {            /* the playhead, as heard */
    const p = X(chopHeard());
    g.fillStyle = DIM;
    g.fillRect(Math.round(p), 12, 1, Hh - 12);
  }
}

function chopZip() {

/* ---------------------------------------------------------- mixer (v3) --- */
/* dev.mix = TRACK reply + pan per track ({sel, ntrk, tracks: [{engine, preset, level, mute, armed, pan}]}).
   Read on connect, after every RELOAD / sound change, with the slow safety DUMP and when the tab opens.
   The selected track's level / pan / mute are also Sound parameters: both views follow each other. */
let mixDrag = null;                 /* "lv:i" / "pan:i" while a strip control is dragged */
const mixEdit = new Map();          /* "lv:i" / "pan:i" -> time of the user's last change */
const mixCtl = [];                  /* per track: the strip's elements */
let panning = false;                /* v3 firmware: another track is selected for a moment (pan of a track that is not selected) */
const mixTouched = (kind, i) => mixDrag === `${kind}:${i}` || performance.now() - (mixEdit.get(`${kind}:${i}`) || 0) < 600
  || (!!dev && kind === "lv" && dev.link.hasQueued("mix:" + i))
  || (kind === "pan" && (panWant.has(i) || (!!dev && dev.link.hasQueued("pan:" + i))));
const drumTrack = (i) => !!dev && !!dev.mix && i === dev.mix.ntrk - 1;
function trackName(x) {
  if (x.engine >= dev.info.nengines) return ["DRUMS", (dev.kitNames || [])[x.e0]].filter(Boolean).join(" ");
  return [dev.info.engines[x.engine], (dev.names[x.engine] || [])[x.preset]].filter(Boolean).join(" ");
}

async function readMixer() {
  const d = dev;
  if (!d || !hasTracks()) return;
  const m = await mixer.read(rq, d.info, { pan: pPan(), fx: pFx(), fxoff: pFxoff() });
  if (d !== dev) return;
  if (d.mix) m.tracks.forEach((x, i) => {           /* what the user is moving stays */
    const o = d.mix.tracks[i];
    if (!o) return;
    if (mixTouched("lv", i)) { x.level = o.level; x.mute = o.mute; }
    if (mixTouched("pan", i)) x.pan = o.pan;
    if (x.fx && o.fx) x.fx = x.fx.map((v, j) => (mixTouched("fx" + j, i) ? o.fx[j] : v));
    if (mixTouched("fxoff", i)) x.fxoff = o.fxoff;
  });
  if (d.dump) m.tracks[m.ntrk - 1].drrev = d.mix && mixTouched("fx3", m.ntrk - 1) ? d.mix.tracks[m.ntrk - 1].drrev : d.dump.g[gDrRev()];
  d.mix = m;
  if (m.sel !== d.sel && !panning) { d.sel = m.sel; needReload = true; }   /* selected on the device, push missed */
  renderMixer();
}

/* the Sound view's values of the selected track (and the drum level, a global) -> the strips */
function mixFromDump() {
  if (!dev || !dev.mix || !dev.dump || panning) return;
  const m = dev.mix, ds = m.ntrk - 1, x = m.tracks[dev.sel];
  if (!mixTouched("lv", ds)) m.tracks[ds].level = dev.dump.g[gDrLvl()];
  if (x) {

/* Patches live in IndexedDB "felucca-editor": store "patches" (by id), store "meta" ("layout": the
   parameter keys / engine names the stored values are in). Without IndexedDB (some private windows)

const store = (() => {
  let dbp = null;

    try {

      r.onupgradeneeded = () => { r.result.createObjectStore("patches", { keyPath: "id" }); r.result.createObjectStore("meta"); };
      r.onsuccess = () => res(r.result);

    putMany: (ps) => tx("patches", "readwrite", (os) => { ps.forEach((p) => os.put(p)); }),
    del: (id) => tx("patches", "readwrite", (os) => os.delete(id)),

}
const rqf = (r, o) => rq(r, o);
const checkRc = (rc) => { if (rc) throw new Error(t("flashFail").replace("{rc}", rc)); };
async function refreshSlot(slot) {
  const r = parse[CMD.UP_LIST](await rq(req.upList(slot, 1)));
  if (dev && dev.bank && r.slots[0]) dev.bank.slots[slot] = r.slots[0];
}

function libAudition(id) {
  const p = lib.find((x) => x.id === id);
  if (!p || !dev || libBusy) return;
  if (isDrum()) { sayK("drumNoSound"); return; }
  libOp(async () => {
    if (!engineOk(p)) throw new Error(t("badEngine") + (p.engineName || p.engine));
    sayK("auditioning", p.name);
    selfLoad(true);
    const r = await auditionPatch(rqf, dev.info, p, { gEng: gEng(),
      sendDX7: (message) => dev.link.transferDX7(message),
      progress: (i, n) => { if (i % 8 === 0) sayK("auditioning", `${p.name} ${i}/${n}`); } });
    await afterSoundChange();
    fm6Auditioned = p.dx7 ? { id: p.id, sel: dev.sel } : null;
    sayK(p.dx7 ? "dx7Sent" : r.wrote ? "auditionedPat" : "auditioned", p.name);
  });
}
$("libaud").addEventListener("click", () => libAudition(libSel));

$("libsave").addEventListener("click", () => libOp(async () => {
  if (isDrum()) { sayK("drumNoSound"); return; }
  const def = upName((dev.names[dev.dump.engine] || [])[dev.dump.preset] || dev.info.engines[dev.dump.engine]);
  const name = prompt(t("promptName"), def);
  if (name == null) return;
  const { patch } = await capturePatch(rqf, dev.info, name.trim() || def);
  await libAdd([patch]);
  sayK("savedLib", patch.name);
}));

/* factory preset -> library: PRESET, then DUMP + steps; its pattern only if it brought one (the device
   loads a preset's pattern into an empty sequencer, or over one that is still an untouched preset pattern) */
$("factlib").addEventListener("click", () => libOp(async () => {
  const e = dev.dump.engine, pi = $("preset").value === "" ? dev.dump.preset : +$("preset").value;
  const name = (dev.names[e] || [])[pi] || "PRESET";
  const before = dev.steps.length >= UP.PAT ? patternFromSteps(dev.steps) : null;
  const wasEmpty = dev.steps.length && dev.steps.every((s) => !s || !s.n);
  selfLoad(true);
  await rq(req.preset(e, pi));
  const { patch } = await capturePatch(rqf, dev.info, name);
  const brought = wasEmpty || !before || JSON.stringify(before) !== JSON.stringify(patch.pattern || patternFromSteps([]));
  if (!brought) patch.pattern = null;
  patch.tags = ["factory"];
  await libAdd([patch]);
  await afterSoundChange();
  sayK("copiedLib", `${dev.info.engines[e]} ${name}`);
}));

function libPut(id, slot) {
  const p = lib.find((x) => x.id === id);
  if (!p || !dev || !dev.bank || slot == null || libBusy) return;
  if (p.dx7) { sayK("dx7Store"); return; }
  const s = dev.bank.slots[slot];
  if (!engineOk(p)) { sayK("badEngine", p.engineName || p.engine); return; }
  if (s.used && !confirm(t("confirmOverwrite").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async () => {
    checkRc(await bank.put(rqf, slot, { ...p, name: upName(p.name), p: fullParams(p) }));
    await refreshSlot(slot);
    sayK("putDone", `${slotName(slot)} ${upName(p.name)}`);
  });
}
$("libput").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (p && p.dx7) fm6Put(libSel, fm6Target()); else libPut(libSel, bankSel);
});

$("libren").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (!p) return;
  const v = prompt(t("promptName"), p.name);
  if (v == null || !v.trim()) return;
  p.name = v.trim().slice(0, 32);
  libUpdate(p);
});
$("libtags").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (!p) return;
  const v = prompt(t("promptTags"), p.tags.join(", "));
  if (v == null) return;
  p.tags = [...new Set(v.split(",").map((x) => x.trim()).filter(Boolean))];
  libUpdate(p);
});
$("libdup").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (p) libAdd([{ ...p, name: (p.name + " 2").slice(0, 32), created: nowIso(), modified: nowIso() }]);
});
$("libdel").addEventListener("click", async () => {
  const p = lib.find((x) => x.id === libSel);
  if (!p || !confirm(t("confirmDelete").replace("{name}", p.name))) return;
  lib = lib.filter((x) => x !== p);
  libSel = null;
  try { await store.del(p.id); } catch (e) { console.warn(e); }
  renderLib();
});

function download(name, obj) { saveBlob(name, new Blob([JSON.stringify(obj, null, 1)], { type: "application/json" })); }
function saveBlob(name, blob) {
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const fileSlug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "patch";
const today = () => new Date().toISOString().slice(0, 10);
$("libexp1").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (p) download(`felucca-patch-${fileSlug(p.name)}.json`, libraryFile("patch", [p], libCtx()));
});
$("libexport").addEventListener("click", () => download(`felucca-library-${today()}.json`, libraryFile("library", lib, libCtx())));
$("libimport").addEventListener("click", () => { $("libfile").value = ""; $("libfile").click(); });
/* what an import read past, for the message after it ("" when nothing) */
function dx7Notes(r) {
  const n = [r.badSum && t("dx7BadSum"), r.short && t("dx7Short"), r.others && t("dx7Others").replace("{n}", r.others)];
  return n.filter(Boolean).join(", ");
}
$("libfile").addEventListener("change", async () => {
  let n = 0, skipped = 0;
  const notes = [];                                 /* what a tolerant DX7 import read past */
  for (const f of [...$("libfile").files]) {
    try {
      const ctx = libCtx();
      if (/\.syx$/i.test(f.name)) {                 /* DX7 voices / 32-voice banks -> FM6 library entries */
        const r = readDX7File(new Uint8Array(await f.arrayBuffer()), ctx);
        await libAdd(r.patches);
        n += r.patches.length;
        const nt = dx7Notes(r);
        if (nt) notes.push(`${f.name}: ${nt}`);
        continue;
      }
      const obj = JSON.parse(await f.text());
      const r = readLibraryFile(obj, ctx);
      if (!ctx.keys && r.keys) {                     /* no layout yet: the file's becomes the library's */
        libMeta = { keys: r.keys, engines: Array.isArray(obj.engines) ? obj.engines : null, pe0: obj.pE0 ?? null };
        try { await store.setMeta("layout", libMeta); } catch (e) { console.warn(e); }
      }
      if (obj.kind === "bank") r.patches.forEach((p) => { if (!p.tags.includes("bank")) p.tags.push("bank"); });
      await libAdd(r.patches);
      n += r.patches.length;
      skipped += r.skipped;
    } catch (e) { sayK("badfile", `${f.name}: ${e.message}`); return; }
  }
  sayK("imported", n + (skipped ? t("skippedN").replace("{n}", skipped) : t("patchesN")) + (notes.length ? ` (${notes.join("; ")})` : ""));
});

/* device bank */
function bankLoad(slot) {
  if (!dev || !dev.bank || slot == null || libBusy) return;
  if (isDrum()) { sayK("drumNoSound"); return; }
  const s = dev.bank.slots[slot];
  libOp(async () => {
    selfLoad();
    const rc = await bank.load(rqf, slot);
    if (rc) { sayK("emptySlot", slotName(slot)); return; }
    await afterSoundChange();
    sayK("loadedUser", `${slotName(slot)} ${s.name}`);
  });
}
$("bkload").addEventListener("click", () => bankLoad(bankSel));
$("bkstore").addEventListener("click", () => {
  const slot = bankSel;
  if (!dev || !dev.bank || slot == null) return;
  if (isDrum()) { sayK("drumNoSound"); return; }
  const s = dev.bank.slots[slot];
  const name = prompt(t("promptNameAuto"), s.used ? s.name : "");
  if (name == null) return;
  if (s.used && !confirm(t("confirmOverwrite").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async () => {
    checkRc(await bank.store(rqf, slot, name.trim()));
    await refreshSlot(slot);
    sayK("storedSlot", `${slotName(slot)} ${dev.bank.slots[slot].name}`);
  });
});
function bankGet(slot) {
  if (!dev || !dev.bank || slot == null || libBusy) return;
  libOp(async () => {
    const u = await bank.get(rqf, dev.info, slot);
    if (!u.used) { sayK("emptySlot", slotName(slot)); return; }
    await libAdd([{ name: u.name, engine: u.engine, engineName: dev.info.engines[u.engine], p: u.p, pattern: u.pattern, tags: ["device"] }]);
    sayK("copiedLib", u.name);
  });
}
$("bkget").addEventListener("click", () => bankGet(bankSel));
$("bkerase").addEventListener("click", () => {
  const slot = bankSel;
  if (!dev || !dev.bank || slot == null) return;
  const s = dev.bank.slots[slot];
  if (!s.used || !confirm(t("confirmEraseSlot").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async () => {
    checkRc(await bank.erase(rqf, slot));
    await refreshSlot(slot);
    sayK("erasedSlot", slotName(slot));
  });
});
$("bkrefresh").addEventListener("click", () => libOp(async () => {
  sayK("readingBank");
  dev.bank = await bank.list(rqf);
  sayK("ready");
}));
$("bkexport").addEventListener("click", () => libOp(async () => {
  const out = [];
  for (const x of dev.bank.slots) {
    if (!x.used) continue;
    sayK("readingBank", ` ${slotName(x.slot)}`);
    const u = await bank.get(rqf, dev.info, x.slot);
    if (u.used) out.push({ name: u.name, engine: u.engine, engineName: dev.info.engines[u.engine], p: u.p, pattern: u.pattern, slot: x.slot });
  }
  download(`felucca-bank-${today()}.json`, libraryFile("bank", out, libCtx()));
  sayK("ready");
}));

/* FM6 bank: DX7 voices in the device's 32 user slots (U01..U32 of an FM6 track's VOICE). Every change is
   read, changed and written back whole (the device saves the bank in its own flash area), then confirmed
   by a readback. FM6 bank / DX7 import: ported from Melodee (Kerem Kilic, github.com/keremimo/melodee),
   GPL-3.0-only; an older SLOOP with no free USR slot: FM6.NO_SLOT */
let fm6Sel = null;              /* the selected FM6 slot */
let fm6Auditioned = null;       /* {id, sel}: the DX7 library entry last auditioned and on which track */
const fm6State = (bank) => ({ bank, names: fm6Bank.names(bank) });
const fm6Eng = () => (dev ? dev.info.engines.indexOf("FM6") : -1);
const fm6OnTrack = () => !!(dev && dev.dump && dev.dump.engine === fm6Eng());
/* VOICE of the first user slot: the factory voices come first, the bank last */
function fm6Nrom() {
  const d = fm6OnTrack() ? dev.pdesc[dev.info.pe0] : null;
  return d && d.max + 1 > FM6.SLOTS ? d.max + 1 - FM6.SLOTS : FM6.NROM;
}
/* where Keep puts a voice: the selected slot, else the first free one */
function fm6Target() {
  if (!dev || !dev.fm6) return null;
  if (fm6Sel != null) return fm6Sel;
  const f = fm6Bank.free(dev.fm6.bank);
  return f.length ? f[0] : null;
}
async function fm6Write(bank) {
  sayK("fm6Writing");
  dev.fm6 = fm6State(await dev.link.writeFM6Bank(bank));
}
async function fm6Change(edit) {                    /* edit(bank) -> the new bank, or null: nothing to write */
  sayK("fm6Reading");
  const bank = await dev.link.readFM6Bank();        /* (STORE on the device may have changed it) */
  dev.fm6 = fm6State(bank);
  const b = edit(bank);
  if (!b) return false;
  await fm6Write(b);
  return true;
}
async function fm6Reread() {                        /* the bank again (a sample slot changed); quiet on failure */
  if (!dev || !dev.fm6) return;
  try { dev.fm6 = fm6State(await dev.link.readFM6Bank()); } catch (e) { /* kept: shown again by the next action */ }
  renderFm6();
  renderLib();
}
async function fm6PointTrack(slot) {                /* the selected track's VOICE -> U(slot) */
  await rq(req.set(0, dev.info.pe0, fm6Nrom() + slot));
  dev.dump = await getDump();
  refreshAll();
}

/* an FM6 track's VOICE beyond the factory voices: the bank slot and its voice name */
function fm6VoiceText(scope, id, v) {
  if (scope || !dev || id !== dev.info.pe0 || !fm6OnTrack() || v < fm6Nrom()) return null;
  const k = v - fm6Nrom(), name = dev.fm6 ? dev.fm6.names[k] : null;
  return slotName(k) + (name && name !== FM6.INIT ? " " + name : "");
}
function fm6Relabel() {                             /* the bank changed: the VOICE choices follow */
  const c = dev && dev.dump && ctl.get(key(0, dev.info.pe0));
  if (!c || c.input.tagName !== "SELECT") return;
  for (const o of c.input.options) { const fv = fm6VoiceText(0, dev.info.pe0, +o.value); if (fv) o.textContent = fv; }
  showValue(key(0, dev.info.pe0), dev.dump.p[dev.info.pe0], false);
}

function renderFm6() {
  fm6Relabel();
  const pane = $("fm6pane"), has = !!(dev && dev.fm6);
  $("fm6hint").hidden = has;
  $("fm6hint").textContent = !dev || !dev.dump ? t("fm6Connect") : t("fm6None");
  if (!has) { pane.hidden = true; return; }
  pane.hidden = false;
  const names = dev.fm6.names, used = names.filter((n) => n !== FM6.INIT).length;
  const playing = fm6OnTrack() ? dev.dump.p[dev.info.pe0] - fm6Nrom() : -1;
  $("fm6head").textContent = `${used} / ${FM6.SLOTS} ${t("used")}`;
  const tb = el("table", {}, el("colgroup", {}, el("col", { class: "n" }), el("col")),
    el("tr", {}, el("th", { text: "#" }), el("th", { text: t("name") })));
  names.forEach((name, k) => {
    const empty = name === FM6.INIT;
    const tr = el("tr", { "data-fm6": k, class: [k === fm6Sel ? "sel" : "", empty ? "empty" : ""].join(" ").trim() || null,
      draggable: empty ? null : "true", title: name },
      el("td", { text: slotName(k) }), el("td", {}, k === playing ? icon("symbol_audio") : "", empty ? t("empty") : name));
    tr.addEventListener("click", () => { fm6Sel = fm6Sel === k ? null : k; renderFm6(); renderLib(); });
    tr.addEventListener("dblclick", () => fm6Use(k));
    tr.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/x-felucca-fm6", String(k)); e.dataTransfer.effectAllowed = "copy"; });
    tr.addEventListener("dragover", (e) => { if (e.dataTransfer.types.includes("text/x-felucca-lib")) { e.preventDefault(); tr.classList.add("over"); } });
    tr.addEventListener("dragleave", () => tr.classList.remove("over"));
    tr.addEventListener("drop", (e) => {
      e.preventDefault();
      tr.classList.remove("over");
      const id = e.dataTransfer.getData("text/x-felucca-lib");
      if (id) fm6Put(id, k);
    });
    tb.append(tr);
  });
  $("fm6list").replaceChildren(tb);
  const idle = !libBusy, s = fm6Sel != null && names[fm6Sel] !== FM6.INIT;
  $("fmuse").disabled = fm6Sel == null || !idle;
  $("fmget").disabled = !s || !idle;
  $("fmclear").disabled = !s || !idle;
  $("fmimport").disabled = $("fmrefresh").disabled = !idle;
  $("fmexport").disabled = !idle;
}

/* a DX7 library voice -> FM6 slot k; the track it was auditioned on now plays it from there */
function fm6Put(id, k) {
  const p = lib.find((x) => x.id === id);
  if (!p || !dev || !dev.fm6 || libBusy) return;
  if (!p.dx7) { sayK("badEngine", p.engineName || p.engine); return; }
  if (k == null) { sayK("fm6Full"); return; }
  const old = dev.fm6.names[k];
  if (old !== FM6.INIT && !confirm(t("confirmOverwrite").replace("{n}", slotName(k)).replace("{name}", old))) return;
  libOp(async () => {
    await fm6Change((b) => fm6Bank.withVoice(b, k, p.dx7));
    fm6Sel = null;                                  /* the next Keep: the next free slot */
    if (fm6Auditioned && fm6Auditioned.id === p.id && fm6Auditioned.sel === dev.sel && fm6OnTrack()) await fm6PointTrack(k);
    sayK("fm6Stored", `${slotName(k)} ${dev.fm6.names[k]}`);
  });
}
/* the selected track plays slot k (a synth track becomes FM6 first) */
function fm6Use(k) {
  if (!dev || !dev.fm6 || k == null || libBusy) return;
  if (isDrum()) { sayK("drumNoSound"); return; }
  libOp(async () => {
    selfLoad(true);                                 /* (a SET of G_ENGSEL when FM6 is not on the track yet) */
    const sw = !fm6OnTrack();
    if (sw) {
      await rq(req.set(1, gEng(), fm6Eng()));
      dev.dump = await getDump();
      await rereadEngineDesc();
    }
    await fm6PointTrack(k);
    fm6Auditioned = null;
    if (sw) await afterSoundChange();
    sayK("fm6Playing", `${slotName(k)} ${dev.fm6.names[k]}`);
  });
}
function fm6Get(k) {
  if (!dev || !dev.fm6 || k == null) return;
  const v = fm6Bank.voice(dev.fm6.bank, k), name = dx7Name(v) || "DX7 VOICE";
  libAdd([{ name, engine: fm6Eng(), engineName: "FM6", dx7: v, tags: ["DX7", "device"] }]);
  sayK("copiedLib", name);
}
$("fmuse").addEventListener("click", () => fm6Use(fm6Sel));
$("fmget").addEventListener("click", () => fm6Get(fm6Sel));
$("fmclear").addEventListener("click", () => {
  const k = fm6Sel;
  if (!dev || !dev.fm6 || k == null) return;
  if (!confirm(t("confirmEraseSlot").replace("{n}", slotName(k)).replace("{name}", dev.fm6.names[k]))) return;
  libOp(async () => {
    await fm6Change((b) => fm6Bank.withVoice(b, k, dx7Init()));
    sayK("erasedSlot", slotName(k));
  });
});
$("fmrefresh").addEventListener("click", () => libOp(async () => {
  sayK("fm6Reading");
  dev.fm6 = fm6State(await dev.link.readFM6Bank());
  sayK("ready");
}));
$("fmexport").addEventListener("click", () => {
  if (dev && dev.fm6) saveBlob(`felucca-fm6-bank-${today()}.syx`, new Blob([Uint8Array.from(fm6Bank.message(dev.fm6.bank))], { type: "application/octet-stream" }));
});
$("fmimport").addEventListener("click", () => { $("fmfile").value = ""; $("fmfile").click(); });
/* a 32-voice bank replaces the device's bank; single voices go into free slots from the selected one on */
$("fmfile").addEventListener("change", () => {
  const f = $("fmfile").files[0];
  if (!f || !dev || !dev.fm6) return;
  libOp(async () => {
    const bytes = new Uint8Array(await f.arrayBuffer());
    let voices, r;
    try { r = readDX7File(bytes, libCtx()); voices = r.patches.map((p) => p.dx7); }
    catch (e) { sayK("badfile", `${f.name}: ${e.message}`); return; }
    const nt = dx7Notes(r), fn = nt ? `${f.name}: ${nt}` : f.name;   /* (what the import read past) */
    const whole = r.banks.length === 1 && voices.length === 32 ? r.banks[0] : undefined;   /* one whole bank */
    if (whole) {
      if (!confirm(t("fm6Replace").replace("{name}", f.name))) return;
      await fm6Write(whole);
      sayK("fm6Replaced", fn);
      return;
    }
    let placed = [];
    await fm6Change((b) => {
      const free = fm6Bank.free(b, fm6Sel ?? 0);
      if (free.length < voices.length) {
        sayK("error", t("fm6NoRoom").replace("{n}", voices.length).replace("{free}", free.length));
        return null;
      }
      placed = free.slice(0, voices.length);
      return voices.reduce((acc, v, i) => fm6Bank.withVoice(acc, placed[i], v), b);
    });
    if (placed.length) {
      fm6Sel = null;
      sayK("fm6Stored", placed.map(slotName).join(" ") + ` (${fn})`);
    }
  });
});

$("connect").addEventListener("click", () => connect());
$("disconnect").addEventListener("click", () => { wantConnected = false; disconnect(); });
applyText();
tipAll();
showTab(tab);
libInit();
if (QS.get("connect") !== "0") connect();          /* auto-connect on load (?connect=0: wait for the button) */
if (QS.get("e2e") === "1") window.fm1E2E = { dev: () => dev };   /* (?e2e=1: web/e2e_daw.mjs looks at the link) */
else if (!MOCK && !navigator.requestMIDIAccess) sayK("nomidi");
})();
</script>
</body>
