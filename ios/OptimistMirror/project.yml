# XcodeGen spec (brew install xcodegen): after a change here run `xcodegen` in this folder and commit OptimistMirror.xcodeproj with it.
# Signing: automatic, with the team in Local.xcconfig (git-ignored: DEVELOPMENT_TEAM = <your team ID>), which Signing.xcconfig
# includes when it is there; without it Xcode asks for a team. No personal id is committed.
name: OptimistMirror
options:
  bundleIdPrefix: com.w0ts.optimist
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  OptimistMirror:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.w0ts.optimist.mirror
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO   # (one bundle id: iPhone, iPad and Mac are one App Store app)
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: OptimistMirror.entitlements   # (the Mac App Store's sandbox: Bluetooth, USB MIDI, files picked)
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Optimist Mirror
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Connects to the FM-1 over Bluetooth MIDI to show its screen."
        INFOPLIST_KEY_UIStatusBarHidden: YES
        # all four, but the app allows only portrait (Turn) except while iOS's Bluetooth sheet is up: the picture turns itself (Tilt)
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
  OptimistMirrorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: OptimistMirror
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.w0ts.optimist.mirror.tests
schemes:
  OptimistMirror:
    build:
      targets:
        OptimistMirror: all
        OptimistMirrorTests: [test]
    test:
      targets: [OptimistMirrorTests]
