# XcodeGen spec (brew install xcodegen): after a change here run `xcodegen` in this folder and commit OptimistMirror.xcodeproj with it.
# Signing: automatic, with the team in Local.xcconfig (git-ignored: DEVELOPMENT_TEAM = <your team ID>), which Signing.xcconfig
# includes when it is there; without it Xcode asks for a team. No personal id is committed.
name: OptimistMirror
options:
  bundleIdPrefix: com.w0ts.optimist
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "4"
targets:
  OptimistMirror:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes: [Fm1Base]
      - path: Resources/Fm1Base      # (fm1-base's pages, MPL-2.0, unchanged: a folder, its sub-folders kept)
        type: folder
        buildPhase: resources
    info:                              # (Info.plist, written by xcodegen; the rest of the keys are INFOPLIST_KEY_* below)
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # the FM-1 firmware package (.fwsc, what the builder makes): this app opens it (Finder, Files, AirDrop, Mail) and shows it
        # ready to install in the Firmware screen; nothing is written until Install is tapped
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.w0ts.optimist.fwsc
            UTTypeDescription: FM-1 Firmware Package
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fwsc]
        CFBundleDocumentTypes:
          - CFBundleTypeName: FM-1 Firmware Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.w0ts.optimist.fwsc]
    preBuildScripts:
      # the web editor and what it loads, from web/ into the bundle's OptimistEditor/ (tools/sync_ios_editor.py): no copy is committed
      - name: Bundle the web editor
        script: python3 "$SRCROOT/../../tools/sync_ios_editor.py" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/OptimistEditor"
        basedOnDependencyAnalysis: false
      # the pinned M-Flasher release (tools/mflasher.py, the one source of truth) as mflasher.json: the Firmware tab's links
      - name: Bundle the M-Flasher release
        script: python3 "$SRCROOT/../../tools/sync_mflasher.py" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/mflasher.json"
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # (the script reads ../../web, outside this project's folder)
        PRODUCT_BUNDLE_IDENTIFIER: com.w0ts.optimist.mirror
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO   # (one bundle id: iPhone, iPad and Mac are one App Store app)
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: OptimistMirror.entitlements   # (the Mac App Store's sandbox: Bluetooth, USB MIDI, files picked, downloads)
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Optimist Mirror
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Connects to the FM-1 over Bluetooth MIDI to show its screen."
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # all four, but the app allows only portrait (Turn) except while iOS's Bluetooth sheet is up: the picture turns itself (Tilt)
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
  OptimistMirrorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: OptimistMirror
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.w0ts.optimist.mirror.tests
schemes:
  OptimistMirror:
    build:
      targets:
        OptimistMirror: all
        OptimistMirrorTests: [test]
    test:
      targets: [OptimistMirrorTests]
